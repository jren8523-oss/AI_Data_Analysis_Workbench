          +customSel([{v:"1",l:"Welch（不假设等方差，SPSS 默认）"},{v:"0",l:"Student 合并方差（要求等方差）"}], "1", "cfg_welch")
          +'</div>'
          +'<div class="hint">使用提示：① 独立样本：分组列只取前两组（如「男/女」「实验班/对照班」）；② 配对样本：行号需对齐（同一对象的前后/左右测量）；③ 单样本：填入理论均值（如教材规定的合格分、行业均值）。</div>';
      },
      run:function(ds, cfg){
        var type=cfg.type||"ind";
        if(type==="ind"){
          var yIdx=parseInt(cfg.y,10), gIdx=parseInt(cfg.grp,10);
          var mp={}, order=[];
          ds.rows.forEach(function(r){
            var gk=String(r[gIdx]); var y=parseNum(r[yIdx]);
            if(y==null||isNaN(y)) return;
            if(mp[gk]==null){ mp[gk]=[]; order.push(gk); }
            mp[gk].push(y);
          });
          if(order.length<2) throw "分组列只有 "+order.length+" 个有效组，t 检验需要至少 2 组";
          var a=mp[order[0]], b=mp[order[1]];
          var res=ttestIndependent(a, b, {welch:cfg.welch!=="0", conf:parseFloat(cfg.conf)||0.95});
          res.yCol=ds.headers[yIdx], res.gCol=ds.headers[gIdx];
          res.groupA=order[0], res.groupB=order[1];
          res.a=a, res.b=b;
          res.alt=cfg.alt||"two";
          return res;
        }
        if(type==="paired"){
          var aIdx=parseInt(cfg.a,10), bIdx=parseInt(cfg.b,10);
          var aArr=[], bArr=[];
          ds.rows.forEach(function(r){
            var av=parseNum(r[aIdx]), bv=parseNum(r[bIdx]);
            if(av==null||bv==null||isNaN(av)||isNaN(bv)) return;
            aArr.push(av); bArr.push(bv);
          });
          if(aArr.length<3) throw "配对样本需要至少 3 对（实际 "+aArr.length+" 对）";
          var res=ttestPaired(aArr, bArr);
          res.aCol=ds.headers[aIdx], res.bCol=ds.headers[bIdx];
          res.alt=cfg.alt||"two";
          return res;
        }
        // one-sample
        var yIdx=parseInt(cfg.one_y,10);
        var mu0=parseFloat(cfg.mu0);
        if(!isFinite(mu0)) throw "理论均值 μ₀ 必须是有效数字";
        var vals=colValues(ds.rows, yIdx);
        if(vals.length<2) throw "单样本需要至少 2 个观测（实际 "+vals.length+"）";
        var res=ttestOneSample(vals, mu0);
        res.yCol=ds.headers[yIdx], res.mu0=mu0;
        res.alt=cfg.alt||"two";
        return res;
      },
      render:function(ds, cfg, res){
        var alt=res.alt||"two";
        var pShown = alt==="two"? res.p : (alt==="g1"? tDist1tail(res.t, res.df) : tDist1tail(-res.t, res.df));
        var sig = pShown<0.05;
        var altLabel = alt==="two"? "μ₁ ≠ μ₂（或 μ ≠ μ₀）" : (alt==="g1"? "μ₁ > μ₂（或 μ > μ₀）" : "μ₁ < μ₂（或 μ < μ₀）");
        var kindLabel = res.kind==="ind"? "独立两样本" : (res.kind==="paired"? "配对样本" : "单样本");
        var h="";
        // ① 检验概要
        h+=resBlock('① 检验概要',
          metricCard("检验类型", kindLabel) +
          metricCard("检验方向", altLabel) +
          metricCard("样本量 n", fmtNum(res.kind==="paired"? res.n : (res.n1+(res.n2||0)), 0)) +
          metricCard("样本均值差", fmtSigned(res.diff, 4))
        );
        // ② 关键推断结果
        var pDisp = pShown<1e-4? pShown.toExponential(2) : (pShown<0.001? "p < 0.001" : "p = "+pShown.toFixed(4));
        h+=resBlock('② 关键推断结果',
          metricCard("t 统计量", fmtSigned(res.t, 4), "", "hl") +
          metricCard("自由度 df", fmtNum(res.df, res.df%1===0?0:2)) +
          metricCard("p 值", pDisp, "", sig?"hl":"warn") +
          metricCard("效应量 Cohen's d", fmtSigned(res.cohensD, 3), "", Math.abs(res.cohensD)>=0.8?"hl":Math.abs(res.cohensD)>=0.5?"":"warn") +
          '<div style="margin-top:10px">'+
          formulaCard("零假设 H₀", "两组均值相等 / 样本均值 = μ₀", "零假设下的检验统计量分布：t ~ T(df)") +
          formulaCard("检验统计量 t",
            res.kind==="ind" ? (res.welch? "t = (x̄₁ − x̄₂) / √(s₁²/n₁ + s₂²/n₂)" : "t = (x̄₁ − x̄₂) / [sp·√(1/n₁+1/n₂)]")
            : res.kind==="paired" ? "t = d̄ / (s_d / √n)"
            : "t = (x̄ − μ₀) / (s / √n)",
            res.kind==="ind" ? "x̄₁="+fmtNum(res.m1,4)+"，x̄₂="+fmtNum(res.m2,4)+(res.welch? "，s₁="+fmtNum(res.s1,4)+"，s₂="+fmtNum(res.s2,4)+"，n₁="+res.n1+"，n₂="+res.n2 : "，sp="+fmtNum(Math.sqrt(((res.n1-1)*res.s1*res.s1+(res.n2-1)*res.s2*res.s2)/(res.n1+res.n2-2)),4))
            : res.kind==="paired" ? "d̄="+fmtNum(res.diff,4)+"，s_d="+fmtNum(res.sd,4)+"，n="+res.n
            : "x̄="+fmtNum(res.mean,4)+"，s="+fmtNum(res.std,4)+"，n="+res.n+"，μ₀="+fmtNum(res.mu0,4),
            fmtSigned(res.t, 4)) +
          formulaCard("p 值",
            alt==="two" ? "P(|T| ≥ |t|) = "+pDisp : (alt==="g1"? "P(T ≥ t) = "+pDisp : "P(T ≤ t) = "+pDisp),
            "α="+fmtNum(1-res.conf,2),
            sig? "< 0.05 → 拒绝 H₀" : "≥ 0.05 → 不拒绝 H₀") +
          formulaCard("95% 置信区间",
            res.kind==="ind" ? "["+fmtNum(res.diff,4)+" ∓ t_crit·SE]" : "[x̄ − t_crit·s/√n, x̄ + t_crit·s/√n]",
            "t_crit (df="+(res.df%1===0?res.df:res.df.toFixed(2))+", α="+fmtNum(1-res.conf,2)+") = "+fmtNum(res.crit,4),
            "["+fmtNum(res.ciLower,4)+", "+fmtNum(res.ciUpper,4)+"]") +
          '</div>'
        );
        // ③ 数据可视化
        if(res.kind==="ind"){
          var b1=res.a.slice(), b2=res.b.slice();
          h+=resBlock('③ 描述统计与可视化',
            '<div class="metric-grid">'+
              metricCard("组 A: "+res.groupA+" 均值", fmtNum(res.m1,4), "", "hl") +
              metricCard("组 A: "+res.groupA+" 标准差", fmtNum(res.s1,4)) +
              metricCard("组 A: 样本量 n₁", fmtNum(res.n1,0)) +
              metricCard("组 B: "+res.groupB+" 均值", fmtNum(res.m2,4), "", "hl") +
              metricCard("组 B: "+res.groupB+" 标准差", fmtNum(res.s2,4)) +
              metricCard("组 B: 样本量 n₂", fmtNum(res.n2,0)) +
            '</div>' +
            '<div class="chart-box">'+svgBox(b1, {title:res.groupA+" 分布", subtitle:"n="+res.n1+"，x̄="+fmtNum(res.m1,3)+"，s="+fmtNum(res.s1,3)})+'</div>' +
            '<div class="chart-box">'+svgBox(b2, {title:res.groupB+" 分布", subtitle:"n="+res.n2+"，x̄="+fmtNum(res.m2,3)+"，s="+fmtNum(res.s2,3)})+'</div>'
          );
        } else if(res.kind==="paired"){
          h+=resBlock('③ 描述统计与可视化',
            '<div class="metric-grid">'+
              metricCard("配对 n", fmtNum(res.n,0)) +
              metricCard("前/列 A 均值", fmtNum(res.m1,4)) +
              metricCard("后/列 B 均值", fmtNum(res.m2,4)) +
              metricCard("差值均值 d̄", fmtSigned(res.diff,4), "", "hl") +
              metricCard("差值标准差 s_d", fmtNum(res.sd,4)) +
              metricCard("差值标准误 SE", fmtNum(res.se,6)) +
            '</div>' +
            '<div class="chart-box">'+svgScatterPaired(res.x, res.y, {title:"配对散点（前 vs 后）", subtitle:"对角线 y=x 表示无变化", xLabel:res.aCol, yLabel:res.bCol})+'</div>' +
            '<div class="chart-box">'+svgHist(res.d, {title:"差值（A−B）分布直方图", subtitle:"d̄="+fmtNum(res.diff,3)+"，s_d="+fmtNum(res.sd,3)})+'</div>'
          );
        } else {
          // one-sample
          h+=resBlock('③ 描述统计与可视化',
            '<div class="metric-grid">'+
              metricCard("样本量 n", fmtNum(res.n,0)) +
              metricCard("样本均值 x̄", fmtNum(res.mean,4), "", "hl") +
              metricCard("样本标准差 s", fmtNum(res.std,4)) +
              metricCard("理论均值 μ₀", fmtNum(res.mu0,4)) +
            '</div>' +
            '<div class="chart-box">'+svgHist(res.x, {title:res.yCol+" 分布 + μ₀ 参考线", subtitle:"n="+res.n+"，x̄="+fmtNum(res.mean,3)+"，μ₀="+fmtNum(res.mu0,3)+"，虚线为 μ₀"})+'</div>'
          );
        }
        // ④ 分层解读
        var interpFact = "本次检验 "+kindLabel+"（"+altLabel+"），p 值 "+(pShown<0.0001? "< 0.0001" : "= "+pDisp)+"。" ;
        var interpAnl = "";
        if(sig){
          // 显著 —— 解读差异方向
          var dir="";
          if(res.kind==="ind"){
            dir = res.m1>res.m2? res.groupA+" 均值显著高于 "+res.groupB
                              : res.groupB+" 均值显著高于 "+res.groupA;
          } else if(res.kind==="paired"){
            dir = "A 列与 B 列均值有显著差异（差值 d̄="+fmtSigned(res.diff,4)+"）";
          } else {
            dir = res.yCol+" 均值与 μ₀="+fmtNum(res.mu0,4)+" 有显著差异";
          }
          interpAnl = "在 α="+fmtNum(1-res.conf,2)+" 水平下拒绝 H₀，认为"+dir+"。";
        } else {
          // 不显著 —— 补充置信区间判读
          var nes="";
          if(res.kind==="ind"){
            nes = (res.ciLower<=0 && res.ciUpper>=0)
              ? "；95% 置信区间跨 0，亦佐证无显著差异"
              : "；但置信区间未跨 0，提示样本量不足可能掩盖真实差异";
          } else if(res.kind==="paired"){
            nes = (res.ciLower<=0 && res.ciUpper>=0)
              ? "；差值 95% CI 跨 0 佐证"
              : "；但差值 CI 未跨 0，提示样本量可能不足";
          } else {
            nes = (res.ciLower<=res.mu0 && res.ciUpper>=res.mu0)
              ? "；CI 包含 μ₀ 佐证"
              : "；但 CI 未包含 μ₀，提示样本量可能不足";
          }
          interpAnl = "在 α="+fmtNum(1-res.conf,2)+" 水平下不拒绝 H₀（无显著差异）"+nes+"。";
        }
        var dMag = Math.abs(res.cohensD);
        var interpEff = "Cohen's d = "+fmtSigned(res.cohensD,3)+"，效应量" + (dMag<0.2? "极小（<0.2）" : dMag<0.5? "较小（0.2~0.5）" : dMag<0.8? "中等（0.5~0.8）" : "较大（≥0.8）") + "，" + (dMag<0.2? "统计显著但实际差异很小，谨慎过度解读。": dMag<0.5? "可作参考性证据。": "实务意义明显。");
        h+=resBlock('④ 分层解读',
          finding("fact", "样本与检验", interpFact) +
          finding("anl", "推断结论", interpAnl) +
          finding("anl", "效应量", interpEff) +
          finding("warn", "前提假设",
            "t 检验要求：① "+(res.kind==="ind"? "两组独立，近似正态分布（n≥30 时中心极限定理保证）" : res.kind==="paired" ? "差值近似正态" : "样本近似正态") +
            "；② "+(res.kind==="ind" && !res.welch? "两组方差齐性（Welch 模式已放宽此条）" : "") +
            "；③ 数据无明显极端异常值（可先做箱线图排查）。") +
          finding("sug", "报告建议",
            "SPSS/教材要求 t 检验报告同时给出 t(df)=?, p, 均值差 ± SE, 95% CI, 效应量 d。本工作台全部给出，可在论文/作业中直接引用。")
        );
        // ⑤ 推荐 Prompt
        var dStr;
        if(res.kind==="ind"){
          dStr = "两组数据：组 A="+res.groupA+"（n="+res.n1+"，x̄="+fmtNum(res.m1,3)+"，s="+fmtNum(res.s1,3)+"）；组 B="+res.groupB+"（n="+res.n2+"，x̄="+fmtNum(res.m2,3)+"，s="+fmtNum(res.s2,3)+"）";
        } else if(res.kind==="paired"){
          dStr = "配对数据：列 A="+res.aCol+"，列 B="+res.bCol+"，n="+res.n+" 对，差值 d̄="+fmtNum(res.diff,3)+"，s_d="+fmtNum(res.sd,3);
        } else {
          dStr = "单样本：列="+res.yCol+"，n="+res.n+"，x̄="+fmtNum(res.mean,3)+"，s="+fmtNum(res.std,3)+"，μ₀="+fmtNum(res.mu0,3);
        }
        h+=resBlock('⑤ 推荐 Prompt（课后用 AI 复现）', promptBlock(
          "我有一份数据："+dStr+"。\n请用 scipy.stats 跑"+kindLabel+"（"+altLabel+"，α="+fmtNum(1-res.conf,2)+"，"+(res.kind==="ind"?(res.welch?"Welch 版（equal_var=False）":"Student 等方差版（equal_var=True）"):"标准版")+"），输出 t、df、p 值（双尾）、均值差、标准误 SE、95% CI、Cohen's d 效应量；用 100 字以内解释结论。",
          "工作台即标准答案；Welch 为 SPSS 与 R 默认。"));
        return h;
      }
    },

    anova: {
      name:"单因素方差分析（ANOVA）", short:"多组均值比较 · F 检验 + 多重比较",
      desc:"比较三个及以上独立组的均值是否全相等：先做整体 F 检验（方差分析表），显著后再做多重比较（事后检验）定位究竟哪两组不同。配套方差齐性检验（Levene）与效应量（η² / ω²）。",
      fit:"适合 1 列数值（因变量）+ 1 列分类（因子），教材典型场景 k ≥ 3 组",
      icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="14" width="3" height="4"/></svg>',
      detect:function(ds){
        var opts=colOptions(ds), i;
        var nums=opts.filter(function(o){return o.num;});
        var cats=opts.filter(function(o){return !o.num;});
        if(nums.length<1 || cats.length<1) return false;
        for(i=0;i<cats.length;i++){ if(levelCount(ds, cats[i].idx)>=2) return true; }
        return false;
      },
      config:function(ds){
        var opts=colOptions(ds);
        var nums=opts.filter(function(o){return o.num;}).map(function(o){return o.idx;});
        var cats=opts.filter(function(o){return !o.num;});
        var v0=nums[0], c0=cats.length? cats[0].idx : 0;
        return '<div class="cfg-row"><label>因变量(数值列)</label>'+selHtml(opts, v0, "cfg_y")+'</div>'
          +'<div class="cfg-row"><label>因子(分组列)</label>'+selHtml(opts, c0, "cfg_grp")+'</div>'
          +'<div class="cfg-row"><label>多重比较方法</label>'
          +customSel([{v:"bonf",l:"Bonferroni（控制族系误差）"},{v:"lsd",l:"LSD（最灵敏 · 不校正族系误差）"},{v:"none",l:"不做多重比较"}], "bonf", "cfg_posthoc")
          +'</div>'
          +'<div class="cfg-row"><label>显著性水平 α</label>'
          +customSel([{v:"0.05",l:"0.05（常用）"},{v:"0.01",l:"0.01（严格）"},{v:"0.10",l:"0.10（宽松）"}], "0.05", "cfg_alpha")
          +'</div>'
          +'<div class="cfg-row"><label>方差齐性检验</label>'
          +customSel([{v:"1",l:"做 Levene 检验（SPSS 默认）"},{v:"0",l:"不做"}], "1", "cfg_levene")
          +'</div>'
          +'<div class="cfg-row"><label>效应量</label>'
          +customSel([{v:"both",l:"η² 与 ω² 都给"},{v:"eta",l:"只给 η²"},{v:"none",l:"不给"}], "both", "cfg_effsize")
          +'</div>'
          +'<div class="hint">使用提示：① 因子列每个水平为一组（如「三个车间」「四种工艺」）；② 整体 F 检验显著只说明「均值不全相等」，必须用多重比较定位具体哪两组不同；③ k = 2 时 F = t²，建议直接用 t 检验。当前不把 Bonferroni 近似误称为 Tukey HSD。</div>';
      },
      run:function(ds, cfg){
        var co=colOptions(ds);
        var numsIdx=co.filter(function(o){return o.num;}).map(function(o){return o.idx;});
        var catsIdx=co.filter(function(o){return !o.num;}).map(function(o){return o.idx;});
        var yIdx=parseInt(cfg.y,10);   if(isNaN(yIdx)) yIdx=numsIdx[0];
        var gIdx=parseInt(cfg.grp,10); if(isNaN(gIdx)) gIdx=catsIdx.length? catsIdx[0] : 0;
        var g=groupBy(ds, yIdx, gIdx);
        if(g.order.length<2) throw new Error("因子列只有 "+g.order.length+" 个有效组，方差分析需要至少 2 组");
        var groups=g.order.map(function(k){ var v=g.map[k]; return {name:k, values:v}; });
        var a=anovaOneWay(groups);
        var lev = cfg.levene!=="0" ? leveneTest(groups) : null;
        var alpha=parseFloat(cfg.alpha||"0.05");
        var method=cfg.posthoc||"bonf";
        var comps = method!=="none" ? posthocTest(groups, a.MSw, a.dfw, method, alpha) : [];
        return { yCol:ds.headers[yIdx], gCol:ds.headers[gIdx],
          groups:groups, anova:a, levene:lev, alpha:alpha, method:method, effsize:cfg.effsize||"both", comps:comps };
      },
      render:function(ds, cfg, res){
        var a=res.anova, h="";
        var rows=res.groups.map(function(g){
          var st=describe(g.values);
          return [escXML(g.name), fmtNum(g.values.length,0), fmtNum(st.mean,3), fmtNum(st.std,3)];
        });
        h+=resBlock('① 各组描述统计', '<div class="hint">因子列 <b>'+escXML(res.gCol)+'</b>（k = '+a.k+' 组），因变量 <b>'+escXML(res.yCol)+'</b>，有效样本 N = '+a.N+'。</div>'
          +preTable(["分组（因子水平）","n","均值","标准差"], rows));
        h+=resBlock('② 方差分析表',
          preTable(["来源","SS","df","MS","F","p"],
            [["组间", fmtNum(a.SSb,3), fmtNum(a.dfb,0), fmtNum(a.MSb,3), fmtNum(a.F,3), fmtNum(a.p,4)],
             ["组内", fmtNum(a.SSw,3), fmtNum(a.dfw,0), fmtNum(a.MSw,3), "—", "—"],
             ["总", fmtNum(a.SSt,3), fmtNum(a.dfb+a.dfw,0), "—", "—", "—"]])
          +formulaCard("F 统计量", "F = MS组间 / MS组内", "MS组间 = "+fmtNum(a.MSb,3)+"，MS组内 = "+fmtNum(a.MSw,3), fmtNum(a.F,3)));
        if(res.effsize!=="none"){
          h+=resBlock('③ 效应量',
            metricCard("η² (eta²)", fmtNum(a.eta2,3), "", "hl") + (res.effsize==="both" ? metricCard("ω² (omega²)", fmtNum(a.omega2,3)) : "")
            +'<div class="hint">教材口径：η² 0.01 小 / 0.06 中 / 0.14 大；ω² 比 η² 更保守（无偏）。</div>');
        }
        if(res.levene){
          h+=resBlock('④ 方差齐性检验（Levene）',
            metricCard("W 统计量", fmtNum(res.levene.W,3)) + metricCard("p 值", fmtNum(res.levene.p,4), "", res.levene.p<0.05?"warn":"hl")
            +'<div class="hint">'+(res.levene.p<0.05?"p < 0.05，方差不齐，建议改用 Welch 校正或 Games-Howell 多重比较。":"p ≥ 0.05，方差齐性成立，可用经典 ANOVA。")+'</div>');
        }
        var chartH="";
        res.groups.forEach(function(g){
          chartH += '<div class="chart-box">'+svgBox(g.values, {title:escXML(g.name)+" 分布（n="+g.values.length+"）", subtitle:"中位数 / 四分位 / 均值"})+'</div>';
        });
        h+=resBlock('⑤ 各组分布（箱线图）', chartH);
        if(res.comps.length){
          var mcRows=res.comps.map(function(c){
            return [escXML(c.g1)+" vs "+escXML(c.g2), fmtNum(c.diff,3), fmtNum(c.se,3), fmtNum(c.p,4), c.sig?"显著":"不显著"];
          });
          var mname = res.method==="lsd" ? "LSD" : "Bonferroni";
          h+=resBlock('⑥ 多重比较（'+mname+'，α='+fmtNum(res.alpha,2)+'）',
            preTable(["比较对","均值差","SE","p","结论"], mcRows)
            +(res.method==="bonf"?'<div class="hint">Bonferroni 对两两 t 检验的 p 值按比较次数校正。</div>':''));
        }
        var sig=a.p<res.alpha;
        h+=resBlock('⑦ 分层解读',
          finding("fact","整体检验", "F("+a.dfb+", "+a.dfw+") = "+fmtNum(a.F,3)+"，p = "+fmtNum(a.p,4)+"。"+(sig?"在 α = "+fmtNum(res.alpha,2)+" 下拒绝「各组均值全相等」的原假设。":"在 α = "+fmtNum(res.alpha,2)+" 下不能拒绝「各组均值全相等」的原假设。"))+
          (res.effsize!=="none" ? finding("anl","效应量", "η² = "+fmtNum(a.eta2,3)+"（"+(a.eta2>=0.14?"大效应":a.eta2>=0.06?"中效应":a.eta2>=0.01?"小效应":"极小效应")+"），组别解释了总变异的 "+fmtPct(a.eta2,1)+"。") : "")+
          (sig? finding("sug","差异定位", "整体显著只说明「不全相等」，需看⑥多重比较，定位具体哪两组不同。") : finding("sug","下一步", "整体不显著时通常不必再做两两比较，除非有事先的理论假设。"))+
          finding("warn","前提假设", "ANOVA 依赖独立、正态、方差齐性三个前提。"+(res.levene? (res.levene.p<0.05?" Levene 检验提示方差不齐，结论需谨慎，建议改用 Welch 校正。":" Levene 检验显示方差齐性成立。") : "")));
        return h;
      }
    },

    chi2: {
      name:"卡方检验（列联表分析）", short:"分类数据 · 独立性 / 拟合优度",
      desc:"处理分类（定性）数据的关联性检验：① 独立性检验 —— 两个分类变量是否相关（如「性别 × 购买意愿」「地区 × 满意度」）；② 拟合优度 —— 实际分布是否符合理论比例（如「是否符合 1:2:1」）。输出列联表、期望频数、χ² 统计量与效应量。",
      fit:"适合 2 列分类数据（独立性检验），或 1 列分类数据 + 理论比例（拟合优度）",
      icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>',
      detect:function(ds){
        var cats=colOptions(ds).filter(function(o){return !o.num;});
        return cats.length>=1;
      },
      config:function(ds){
        var opts=colOptions(ds);
        var cats=opts.filter(function(o){return !o.num;}).map(function(o){return o.idx;});
        var r0=cats[0]!==undefined? cats[0] : 0;
        var c0=cats[1]!==undefined? cats[1] : r0;
        return '<div class="cfg-row"><label>检验类型</label>'
          +customSel([{v:"ind",l:"独立性检验 · 两个分类变量是否相关"},{v:"fit",l:"拟合优度 · 实际分布是否符合理论比例"}], "ind", "cfg_type")
          +'</div>'
          +'<div id="cfg_indDiv2" class="cfg-row"><label>行变量</label>'+selHtml(opts, r0, "cfg_row")
          +' &nbsp;<label>列变量</label>'+selHtml(opts, c0, "cfg_col2")+'</div>'
          +'<div id="cfg_fitDiv" class="cfg-row" style="display:none"><label>分类变量</label>'+selHtml(opts, r0, "cfg_cat")
          +' &nbsp;<label>理论比例</label><input type="text" id="cfg_ratio" value="等比例" style="min-width:150px"/></div>'
          +'<div id="cfg_yatesRow" class="cfg-row"><label>Yates 连续性校正</label>'
          +customSel([{v:"auto",l:"自动（2×2 表时启用）"},{v:"1",l:"始终启用"},{v:"0",l:"始终不启用"}], "auto", "cfg_yates")
          +'</div>'
          +'<div id="cfg_chiEffRow" class="cfg-row"><label>效应量</label>'
          +customSel([{v:"v",l:"Cramér's V（通用，含 2×2 的 φ）"},{v:"phi",l:"φ 系数（仅 2×2）"},{v:"none",l:"不给"}], "v", "cfg_eff")
          +'</div>'
          +'<div class="hint">使用提示：① 独立性检验要求期望频数 ≥5 的格子不少于 80%，否则需合并类别或用 Fisher 精确检验；② 拟合优度的理论比例可填「等比例」或「1:2:1」这类冒号分隔的形式；③ 分类列的每个取值视为一个类别。</div>';
      },
      run:function(ds, cfg){
        var type=cfg.type||"ind";
        var catsIdx=colOptions(ds).filter(function(o){return !o.num;}).map(function(o){return o.idx;});
        if(type==="ind"){
          var rIdx=parseInt(cfg.row,10);  if(isNaN(rIdx)) rIdx=catsIdx[0];
          var cIdx=parseInt(cfg.col2,10); if(isNaN(cIdx)) cIdx=catsIdx[1]!==undefined? catsIdx[1] : catsIdx[0];
          var rKeys=[], cKeys=[], mp={}, n=0;
          ds.rows.forEach(function(r){
            var rk=String(r[rIdx]), ck=String(r[cIdx]);
            if(!rk||!ck) return;
            if(mp[rk]==null) mp[rk]={};
            mp[rk][ck]=(mp[rk][ck]||0)+1;
            if(rKeys.indexOf(rk)<0) rKeys.push(rk);
            if(cKeys.indexOf(ck)<0) cKeys.push(ck);
            n++;
          });
          if(rKeys.length<2 || cKeys.length<2) throw "列联表需要行、列变量各有 ≥2 个类别（当前 "+rKeys.length+" × "+cKeys.length+"）";
          var ind=chi2Independence(mp, rKeys, cKeys);
          var yates = cfg.yates==="1" || (cfg.yates==="auto" && rKeys.length===2 && cKeys.length===2);
          if(yates && rKeys.length===2 && cKeys.length===2){
            var chi2=0;
            rKeys.forEach(function(rk){ cKeys.forEach(function(ck){
              var o=mp[rk][ck]||0, e=ind.exp[rk][ck], v=Math.max(0, Math.abs(o-e)-0.5); chi2+=v*v/e;
            }); });
            ind.chi2=chi2; ind.p=chi2P(chi2, ind.df);
          }
          ind.V=Math.sqrt(ind.chi2/(ind.N*Math.min(rKeys.length-1, cKeys.length-1)));
          ind.phi=rKeys.length===2&&cKeys.length===2 ? Math.sqrt(ind.chi2/ind.N) : null;
          ind.yates=yates;
          return { mode:"ind", rCol:ds.headers[rIdx], cCol:ds.headers[cIdx],
            rKeys:rKeys, cKeys:cKeys, mp:mp, ind:ind, effect:cfg.eff||"v" };
        }
        var kIdx=parseInt(cfg.cat,10); if(isNaN(kIdx)) kIdx=catsIdx[0];
        var keys=[], cnt={}, n=0;
        ds.rows.forEach(function(r){
          var k=String(r[kIdx]);
          if(!k) return;
          if(cnt[k]==null){ cnt[k]=0; keys.push(k); }
          cnt[k]++; n++;
        });
        if(keys.length<2) throw "拟合优度需要分类变量有 ≥2 个类别（当前 "+keys.length+"）";
        var fit=chi2GoodnessOfFit(cnt, keys, cfg.ratio||"等比例");
        return { mode:"fit", cat:ds.headers[kIdx], keys:keys, cnt:cnt, N:n, fit:fit, ratio:cfg.ratio||"等比例" };
      },
      render:function(ds, cfg, res){
        var h="";
        if(res.mode==="ind"){
          var ind=res.ind;
          var head=["行 \\ 列"].concat(res.cKeys.map(escXML)).concat(["合计"]);
          var obsRows=res.rKeys.map(function(rk){
            var line=[escXML(rk)], rt=0;
            res.cKeys.forEach(function(ck){ var v=res.mp[rk][ck]||0; rt+=v; line.push(String(v)); });
            line.push(String(rt)); return line;
          });
          var ct=["合计"], gt=0;
          res.cKeys.forEach(function(ck){ var s=0; res.rKeys.forEach(function(rk){ s+=res.mp[rk][ck]||0; }); ct.push(String(s)); gt+=s; });
          ct.push(String(gt)); obsRows.push(ct);
          h+=resBlock('① 观测频数表（O）', '<div class="hint">列联表 <b>'+escXML(res.rCol)+'</b> × <b>'+escXML(res.cCol)+'</b>，'+res.rKeys.length+' × '+res.cKeys.length+' 表，N = '+ind.N+'。</div>'
            +preTable(head, obsRows));
          var expRows=res.rKeys.map(function(rk){
            var line=[escXML(rk)]; res.cKeys.forEach(function(ck){ line.push(fmtNum(ind.exp[rk][ck],2)); }); return line;
          });
          h+=resBlock('② 期望频数表（E）', preTable(["行 \\ 列"].concat(res.cKeys.map(escXML)), expRows)
            +'<div class="hint">E = 行合计 × 列合计 / N，即独立性假设下的理论频数。</div>');
          h+=resBlock('③ 卡方检验结果',
            metricCard("χ² 统计量", fmtNum(ind.chi2,3), "", "hl") + metricCard("自由度 df", fmtNum(ind.df,0)) + metricCard("p 值", fmtNum(ind.p,4), "", ind.p<0.05?"hl":"")
            + (ind.yates?'<div class="hint">已应用 Yates 连续性校正（2×2 表）。</div>':'')
            + formulaCard("卡方统计量", "χ² = Σ (O−E)² / E", "对所有格子求和", fmtNum(ind.chi2,3)));
          if(res.effect!=="none"){
            var isPhi=res.effect==="phi" && ind.phi!==null;
            var effectValue=isPhi ? ind.phi : ind.V;
            var effectLabel=isPhi ? "φ 系数" : "Cramér's V";
            h+=resBlock('④ 效应量 '+effectLabel,
              metricCard(effectLabel, fmtNum(effectValue,3), "", "hl")
              +'<div class="hint">'+(effectValue>=0.5?"强关联":effectValue>=0.3?"中等关联":effectValue>=0.1?"弱关联":"几乎无关联")+'（0.1 弱 / 0.3 中 / 0.5 强）。'+(res.effect==="phi"&&ind.phi===null?" 当前不是 2×2 表，已改报 Cramér's V。":"")+'</div>');
          }
          var maxResid=0, maxCell="—";
          res.rKeys.forEach(function(rk){ res.cKeys.forEach(function(ck){
            var rv=ind.resid[rk][ck]; if(Math.abs(rv)>Math.abs(maxResid)){ maxResid=rv; maxCell=rk+"×"+ck; }
          }); });
          h+=resBlock('⑤ 标准化残差（定位差异格）',
            '<div class="hint">标准化残差 = (O−E) / √E；|残差| > 2 表示该格显著偏离独立性。贡献最大格：<b>'+escXML(maxCell)+'</b>（残差 '+fmtNum(maxResid,2)+'）。</div>');
          var labels=[], obsVals=[], expVals=[];
          res.rKeys.forEach(function(rk){ res.cKeys.forEach(function(ck){
            labels.push(rk+"/"+ck); obsVals.push(res.mp[rk][ck]||0); expVals.push(ind.exp[rk][ck]);
          }); });
          h+=resBlock('⑥ 实际 vs 期望频数对比', '<div class="chart-box">'+svgGroupedBar(labels, [{name:"观测 O",values:obsVals},{name:"期望 E",values:expVals}], {title:"观测 vs 期望频数", subtitle:"对比各格 O 与 E 的偏离"})+'</div>');
          var lowPct=ind.lowE/ind.cells, rel=ind.p<0.05;
          h+=resBlock('⑦ 分层解读',
            finding("fact","检验结果", "χ²("+ind.df+") = "+fmtNum(ind.chi2,3)+"，p = "+fmtNum(ind.p,4)+"。两变量"+(rel?"存在显著关联（拒绝独立性原假设）":"无显著关联（不能拒绝独立性原假设）")+"。")+
            (res.effect!=="none" ? finding("anl","关联强度", (res.effect==="phi"&&ind.phi!==null?"φ 系数":"Cramér's V")+" = "+fmtNum(res.effect==="phi"&&ind.phi!==null?ind.phi:ind.V,3)+"。大样本下 p 值易显著，效应量更能说明实际意义。") : "")+
            finding("warn","近似条件", "最小期望频数 "+fmtNum(ind.minE,2)+"，E < 5 的格子占 "+fmtPct(lowPct,1)+"。"+(ind.minE<1||lowPct>0.2?" 不满足卡方近似条件，建议合并类别或改用 Fisher 精确检验。":" 满足卡方近似条件。"))+
            (rel? finding("sug","差异定位", "看⑤标准化残差：偏离独立性最明显的是「"+escXML(maxCell)+"」格，即关联的主要来源。") : finding("sug","结论", "两变量未见显著关联，报告可到此为止，或换用其他维度再检验。")));
        } else {
          var fit=res.fit;
          var rows2=res.keys.map(function(k, i){
            return [escXML(k), String(res.cnt[k]), fmtPct(res.cnt[k]/res.N,1), fmtNum(fit.ratios[i]*100,1)+"%", fmtNum(fit.exp[k],2)];
          });
          h+=resBlock('① 实际 vs 理论频数', '<div class="hint">分类变量 <b>'+escXML(res.cat)+'</b>，'+res.keys.length+' 个类别，N = '+res.N+'，理论比例 <b>'+escXML(res.ratio)+'</b>。</div>'
            +preTable(["类别","实际 O","实际占比","理论比例","期望 E"], rows2));
          h+=resBlock('② 拟合优度检验',
            metricCard("χ² 统计量", fmtNum(fit.chi2,3), "", "hl") + metricCard("自由度 df", fmtNum(fit.df,0)) + metricCard("p 值", fmtNum(fit.p,4), "", fit.p<0.05?"hl":"")
            + formulaCard("卡方统计量", "χ² = Σ (O−E)² / E", "df = k − 1 = "+fit.df, fmtNum(fit.chi2,3)));
          h+=resBlock('③ 分层解读',
            finding("fact","检验结果", "χ²("+fit.df+") = "+fmtNum(fit.chi2,3)+"，p = "+fmtNum(fit.p,4)+"。实际分布与理论比例"+(fit.p<0.05?"存在显著偏离":"无显著偏离")+"。")+
            finding("anl","偏离方向", "看①表：实际占比与理论比例差距最大的类别，就是偏离的主要来源。")+
            finding("sug","结论", (fit.p<0.05?"实际分布不符合设定比例，需结合业务解释偏离原因。":"实际分布符合设定比例，可用该比例描述总体结构。")));
        }
        return h;
      }
    },

    nonparam: {
      name:"非参数检验（分布自由）", short:"不满足正态假设时的替代方案",
      desc:"当数据不满足正态分布、样本量很小或为等级数据时，替代 t 检验与方差分析的分布自由方法：Mann-Whitney U（两独立样本）、Kruskal-Wallis H（多独立样本）、Wilcoxon 符号秩（两配对样本）、Friedman（多配对样本）。基于秩次而非原始数值，不依赖总体分布假设。",
      fit:"适合 1 列数值 + 1 列分组（2 组或多组），或 2 列配对数值",
      icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h5v-6h5V8h5V4"/><polyline points="3 20 21 20"/></svg>',
      detect:function(ds){
        var opts=colOptions(ds);
        var nums=opts.filter(function(o){return o.num;});
        var cats=opts.filter(function(o){return !o.num;});
        return nums.length>=1 && (nums.length>=2 || cats.length>=1);
      },
      config:function(ds){
        var opts=colOptions(ds);
        var nums=opts.filter(function(o){return o.num;}).map(function(o){return o.idx;});
        var cats=opts.filter(function(o){return !o.num;});
        var v0=nums[0], v1=nums[1]!==undefined? nums[1] : nums[0];
        var c0=cats.length? cats[0].idx : 0;
        return '<div class="cfg-row"><label>检验类型</label>'
          +customSel([
            {v:"mw",l:"Mann-Whitney U · 两独立样本（替代独立 t 检验）"},
            {v:"kw",l:"Kruskal-Wallis H · 多独立样本（替代 ANOVA）"},
            {v:"wilcoxon",l:"Wilcoxon 符号秩 · 两配对样本（替代配对 t 检验）"},
            {v:"friedman",l:"Friedman · 多配对样本（替代重复测量 ANOVA）"}
          ], "mw", "cfg_type")
          +'</div>'
          +'<div id="cfg_mwDiv" class="cfg-row"><label>数值列</label>'+selHtml(opts, v0, "cfg_y")
          +' &nbsp;<label>分组列(前两组)</label>'+selHtml(opts, c0, "cfg_grp")+'</div>'
          +'<div id="cfg_kwDiv" class="cfg-row" style="display:none"><label>数值列</label>'+selHtml(opts, v0, "cfg_kw_y")
          +' &nbsp;<label>分组列(全部组)</label>'+selHtml(opts, c0, "cfg_kw_grp")+'</div>'
          +'<div id="cfg_wxDiv" class="cfg-row" style="display:none"><label>列 A(前)</label>'+selHtml(opts, v0, "cfg_a")
          +' &nbsp;<label>列 B(后)</label>'+selHtml(opts, v1, "cfg_b")+'</div>'
          +'<div id="cfg_frDiv" class="cfg-row" style="display:none"><label>配对的多列</label>'+multiSelHtml(opts, [v0, v1], "cfg_multi", 5)+'</div>'
          +'<div class="cfg-row np-option"><label>检验方向</label>'
          +customSel([{v:"two",l:"双尾（推荐）"},{v:"g1",l:"第一组/列 A 更高"},{v:"g2",l:"第二组/列 B 更高"}], "two", "cfg_alt")
          +'</div>'
          +'<div class="cfg-row np-option"><label>连续性校正</label>'
          +customSel([{v:"1",l:"启用（正态近似时更稳健）"},{v:"0",l:"不启用"}], "1", "cfg_cc")
          +'</div>'
          +'<div class="hint">使用提示：① Mann-Whitney 的分组列只取前两组；② Kruskal-Wallis 取分组列的全部水平（至少 3 组）；③ Wilcoxon 要求两列行号对齐（同一对象前后测量）；④ Friedman 用多列配对数据（如同一被试在 3 种条件下的得分）。p 值采用正态近似，精确法暂未提供。</div>';
      },
      run:function(ds, cfg){
        var type=cfg.type||"mw";
        var co=colOptions(ds);
        var numsIdx=co.filter(function(o){return o.num;}).map(function(o){return o.idx;});
        var catsIdx=co.filter(function(o){return !o.num;}).map(function(o){return o.idx;});
        var dNum=numsIdx[0], dCat=catsIdx.length? catsIdx[0] : 0;
        var testOpts={alternative:cfg.alt||"two", continuity:cfg.cc!=="0"};
        if(type==="mw"){
          var yIdx=parseInt(cfg.y,10); if(isNaN(yIdx)) yIdx=dNum;
          var gIdx=parseInt(cfg.grp,10); if(isNaN(gIdx)) gIdx=dCat;
          var g=groupBy(ds, yIdx, gIdx);
          if(g.order.length<2) throw "分组列只有 "+g.order.length+" 个有效组，Mann-Whitney 至少需要 2 组";
          var mw=mannWhitneyU(g.map[g.order[0]], g.map[g.order[1]], testOpts);
          return { mode:"mw", yCol:ds.headers[yIdx], gCol:ds.headers[gIdx],
            g1:g.order[0], g2:g.order[1], mw:mw, gm:g.map };
        }
        if(type==="kw"){
          var kyIdx=parseInt(cfg.kw_y,10); if(isNaN(kyIdx)) kyIdx=dNum;
          var kgIdx=parseInt(cfg.kw_grp,10); if(isNaN(kgIdx)) kgIdx=dCat;
          var kg=groupBy(ds, kyIdx, kgIdx);
          if(kg.order.length<3) throw new Error("分组列只有 "+kg.order.length+" 个有效组，Kruskal-Wallis 至少需要 3 组");
          var kgroups=kg.order.map(function(k){ return {name:k, values:kg.map[k]}; });
          var kw=kruskalWallisH(kgroups);
          return { mode:"kw", yCol:ds.headers[kyIdx], gCol:ds.headers[kgIdx], kw:kw, groups:kgroups };
        }
        if(type==="wilcoxon"){
          var aIdx=parseInt(cfg.a,10); if(isNaN(aIdx)) aIdx=dNum;
          var bIdx=parseInt(cfg.b,10); if(isNaN(bIdx)) bIdx=numsIdx[1]!==undefined? numsIdx[1] : dNum;
          var aArr=[], bArr=[];
          ds.rows.forEach(function(r){
            var av=parseNum(r[aIdx]), bv=parseNum(r[bIdx]);
            if(av==null||bv==null||isNaN(av)||isNaN(bv)) return;
            aArr.push(av); bArr.push(bv);
          });
          if(aArr.length<3) throw "Wilcoxon 符号秩需要至少 3 对有效配对（实际 "+aArr.length+" 对）";
          var wx=wilcoxonSignedRank(aArr, bArr, testOpts);
          return { mode:"wilcoxon", aCol:ds.headers[aIdx], bCol:ds.headers[bIdx], wx:wx };
        }
        var idxs=(cfg.multi||[]).map(function(v){ return parseInt(v,10); });
        if(!idxs.length) idxs=[0,1];
        if(idxs.length<3) throw "Friedman 需要至少 3 列配对数据（当前 "+idxs.length+" 列）";
        var matrix=[];
        ds.rows.forEach(function(r){
          var row=idxs.map(function(i){ return parseNum(r[i]); });
          if(row.some(function(v){ return v==null||isNaN(v); })) return;
          matrix.push(row);
        });
        if(matrix.length<2) throw "Friedman 有效配对行不足（需 ≥2 行完整数据，实际 "+matrix.length+" 行）";
        var fr=friedmanTest(matrix);
        return { mode:"friedman", cols:idxs.map(function(i){ return ds.headers[i]; }), fr:fr };
      },
      render:function(ds, cfg, res){
        var h="";
        if(res.mode==="mw"){
          var mw=res.mw, N=mw.n1+mw.n2, R2=N*(N+1)/2-mw.Ra;
          var md1=describe(res.gm[res.g1]).median, md2=describe(res.gm[res.g2]).median;
          h+=resBlock('① 两组描述（中位数 + 秩）', '<div class="hint">数值列 <b>'+escXML(res.yCol)+'</b>，分组列 <b>'+escXML(res.gCol)+'</b>（取前两组）。</div>'
            +preTable(["组","n","中位数","秩和 R","平均秩"],
              [[escXML(res.g1), String(mw.n1), fmtNum(md1,3), fmtNum(mw.Ra,1), fmtNum(mw.Ra/mw.n1,2)],
               [escXML(res.g2), String(mw.n2), fmtNum(md2,3), fmtNum(R2,1), fmtNum(R2/mw.n2,2)]]));
          h+=resBlock('② Mann-Whitney U 检验',
            metricCard("U 统计量", fmtNum(mw.U,3), "", "hl") + metricCard("z 值", fmtNum(mw.z,3)) + metricCard("p 值", fmtNum(mw.p,4), "", mw.p<0.05?"hl":"")
            + formulaCard("Mann-Whitney U", "U₁ = n₁n₂ + n₁(n₁+1)/2 − R₁", "U = min(U₁, U₂)；U₁="+fmtNum(mw.U1,1)+"，U₂="+fmtNum(mw.U2,1), fmtNum(mw.U,1)));
          h+=resBlock('③ 效应量', metricCard("秩双列相关 r", fmtNum(mw.r,3), "", "hl")
            +'<div class="hint">r = z/√N；0.1 小 / 0.3 中 / 0.5 大。</div>');
          var chartH="";
          [res.g1,res.g2].forEach(function(gk){
            chartH += '<div class="chart-box">'+svgBox(res.gm[gk], {title:escXML(gk)+" 分布（n="+res.gm[gk].length+"）", subtitle:"中位数 / 四分位"})+'</div>';
          });
          h+=resBlock('④ 两组分布（箱线图）', chartH);
          h+=resBlock('⑤ 分层解读',
            finding("fact","检验结果", "U = "+fmtNum(mw.U,3)+"，z = "+fmtNum(mw.z,3)+"，p = "+fmtNum(mw.p,4)+"。两独立样本分布位置"+(mw.p<0.05?"存在显著差异":"无显著差异")+"。")+
            finding("anl","效应量", "秩双列相关 r = "+fmtNum(mw.r,3)+"（"+(Math.abs(mw.r)>=0.5?"大":Math.abs(mw.r)>=0.3?"中":"小")+"效应）。")+
            finding("sug","结论", (mw.p<0.05?"两组分布位置差异显著，结合④箱线图看哪组位置更高。":"两组分布位置未见显著差异，可对照 t 检验结论报告。"))+
            finding("warn","方法提示", "非参数检验比较的是分布位置而非均值；p 值为正态近似。"));
        } else if(res.mode==="kw"){
          var kw=res.kw;
          var rows=res.groups.map(function(g, i){
            var md=describe(g.values).median;
            return [escXML(g.name), String(g.values.length), fmtNum(md,3), fmtNum(kw.rankSums[i],1), fmtNum(kw.rankSums[i]/g.values.length,2)];
          });
          h+=resBlock('① 各组描述（中位数 + 秩）', '<div class="hint">数值列 <b>'+escXML(res.yCol)+'</b>，分组列 <b>'+escXML(res.gCol)+'</b>，k = '+kw.k+' 组，N = '+kw.N+'。</div>'
            +preTable(["组","n","中位数","秩和 R","平均秩"], rows));
          h+=resBlock('② Kruskal-Wallis H 检验',
            metricCard("H 统计量", fmtNum(kw.H,3), "", "hl") + metricCard("自由度 df", fmtNum(kw.df,0)) + metricCard("p 值", fmtNum(kw.p,4), "", kw.p<0.05?"hl":"")
            + formulaCard("Kruskal-Wallis H", "H = 12/(N(N+1)) · Σ(Rⱼ²/nⱼ) − 3(N+1)", "H ~ χ²("+kw.df+")", fmtNum(kw.H,3)));
          h+=resBlock('③ 效应量', metricCard("ε² (epsilon²)", fmtNum(kw.eps2,3), "", "hl")
            +'<div class="hint">ε² = H/(N−1)；0.01 小 / 0.06 中 / 0.14 大。</div>');
          var chartH2="";
          res.groups.forEach(function(g){
            chartH2 += '<div class="chart-box">'+svgBox(g.values, {title:escXML(g.name)+" 分布（n="+g.values.length+"）", subtitle:"中位数 / 四分位"})+'</div>';
          });
          h+=resBlock('④ 各组分布（箱线图）', chartH2);
          h+=resBlock('⑤ 分层解读',
            finding("fact","检验结果", "H("+kw.df+") = "+fmtNum(kw.H,3)+"，p = "+fmtNum(kw.p,4)+"。各独立组分布位置"+(kw.p<0.05?"存在显著差异":"无显著差异")+"。")+
            finding("anl","效应量", "ε² = "+fmtNum(kw.eps2,3)+"（"+(kw.eps2>=0.14?"大":kw.eps2>=0.06?"中":kw.eps2>=0.01?"小":"极小")+"效应）。")+
            finding("sug","下一步", (kw.p<0.05?"整体显著只说明「分布位置不全相同」，如需定位差异来源，可对两两组别补做 Mann-Whitney U（注意校正族系误差）。":"各组分布位置未见显著差异，可作为 ANOVA 的稳健替代结论。")));
        } else if(res.mode==="wilcoxon"){
          var wx=res.wx;
          h+=resBlock('① 配对数据概况', '<div class="hint">配对两列 <b>'+escXML(res.aCol)+'</b>（前）与 <b>'+escXML(res.bCol)+'</b>（后），有效配对 n = '+wx.n+' 对（零差值已剔除）。</div>');
          h+=resBlock('② Wilcoxon 符号秩检验',
            metricCard("W 统计量", fmtNum(wx.W,3), "", "hl") + metricCard("z 值", fmtNum(wx.z,3)) + metricCard("p 值", fmtNum(wx.p,4), "", wx.p<0.05?"hl":"")
            + formulaCard("Wilcoxon 符号秩", "W = min(W⁺, W⁻)", "W⁺ = "+fmtNum(wx.Wp,1)+"（正秩和），W⁻ = "+fmtNum(wx.Wn,1)+"（负秩和）", fmtNum(wx.W,1)));
          h+=resBlock('③ 分层解读',
            finding("fact","检验结果", "W = "+fmtNum(wx.W,3)+"，z = "+fmtNum(wx.z,3)+"，p = "+fmtNum(wx.p,4)+"。配对样本前后"+(wx.p<0.05?"存在显著差异":"无显著差异")+"。")+
            finding("anl","方向判断", (wx.Wp===wx.Wn?"正、负秩和相同，未显示出明确变化方向。":wx.Wp>wx.Wn?"正秩和更大（W⁺="+fmtNum(wx.Wp,1)+" > W⁻="+fmtNum(wx.Wn,1)+"），多数对象「列 A / 前测 > 列 B / 后测」，呈下降趋势。":"负秩和更大（W⁻="+fmtNum(wx.Wn,1)+" > W⁺="+fmtNum(wx.Wp,1)+"），多数对象「列 B / 后测 > 列 A / 前测」，呈上升趋势。"))+
            finding("sug","结论", (wx.p<0.05?"配对前后差异显著，可对照配对 t 检验结论（正态满足时 t 更精确）。":"配对前后未见显著差异。"))+
            finding("warn","方法提示", "零差值已剔除（n 相应减少）；p 值为正态近似。"));
        } else {
          var fr=res.fr;
          h+=resBlock('① Friedman 检验概况', '<div class="hint">配对列：'+res.cols.map(function(c){ return '<b>'+escXML(c)+'</b>'; }).join(" / ")+'，共 '+fr.k+' 个处理条件，有效被试 n = '+fr.n+'。</div>');
          var frRows=res.cols.map(function(c, i){
            return [escXML(c), fmtNum(fr.colRankSum[i],1), fmtNum(fr.colRankSum[i]/fr.n,2)];
          });
          h+=resBlock('② 各处理秩和', preTable(["处理条件","秩和 Rⱼ","平均秩"], frRows));
          h+=resBlock('③ Friedman 检验',
            metricCard("χ²_F 统计量", fmtNum(fr.chi2,3), "", "hl") + metricCard("自由度 df", fmtNum(fr.df,0)) + metricCard("p 值", fmtNum(fr.p,4), "", fr.p<0.05?"hl":"")
            + formulaCard("Friedman", "χ²_F = 12/(n·k(k+1)) · ΣRⱼ² − 3n(k+1)", "χ²_F ~ χ²("+fr.df+")", fmtNum(fr.chi2,3)));
          h+=resBlock('④ 效应量 Kendall\'s W', metricCard("Kendall's W", fmtNum(fr.W,3), "", "hl")
            +'<div class="hint">W = χ²_F/(n(k−1))；0.1 弱 / 0.3 中 / 0.5 强一致。</div>');
          h+=resBlock('⑤ 分层解读',
            finding("fact","检验结果", "χ²_F("+fr.df+") = "+fmtNum(fr.chi2,3)+"，p = "+fmtNum(fr.p,4)+"。各处理条件间"+(fr.p<0.05?"存在显著差异":"无显著差异")+"。")+
            finding("anl","效应量", "Kendall's W = "+fmtNum(fr.W,3)+"（"+(fr.W>=0.5?"强":fr.W>=0.3?"中":"弱")+"一致性）。")+
            finding("sug","结论", (fr.p<0.05?"处理条件间分布显著不同，看②秩和定位差异最大的条件。":"各处理条件间未见显著差异。")));
        }
        return h;
      }
    }
};

    {k:"检验统计量", v:"U（Mann-Whitney）/ H（Kruskal-Wallis）/ W（Wilcoxon）/ χ²_F（Friedman）", note:"按所选检验类型输出对应统计量"},
    {k:"z 值（正态近似）", v:"标准化后的统计量", note:"大样本时用于近似 p 值"},
    {k:"p 值", v:"精确法或正态近似，取决于样本量与参数选择", note:"小样本走精确分布，大样本走正态近似"},
    {k:"秩和", v:"各组秩和 Rⱼ 与平均秩", note:"非参数检验的核心中间量，应展示"},
    {k:"效应量", v:"秩双列相关 r / ε² / Kendall's W", note:"Mann-Whitney 用 r = z/√N；Kruskal-Wallis 与 Friedman 用 ε²"},
    {k:"中位数差", v:"各组中位数（非参数报告中位数而非均值）", note:"与均值并列展示，便于对比参数检验结论"}
  ],
  formulas:[
    {k:"秩次转换", v:"混合全部观测升序排序赋秩，并列取平均秩", note:"所有非参数检验的共同第一步"},
    {k:"Mann-Whitney U", v:"U₁ = n₁n₂ + n₁(n₁+1)/2 − R₁，U = min(U₁, U₂)", note:"检验两独立样本分布位置是否相同"},
    {k:"Kruskal-Wallis H", v:"H = 12/(N(N+1)) · Σ(Rⱼ²/nⱼ) − 3(N+1)", note:"多独立样本，df = k − 1，H ~ χ²(k−1)"},
    {k:"Wilcoxon 符号秩", v:"W = min(W⁺, W⁻)，对 |差值| 赋秩后按符号分组求和", note:"零差值剔除，n 相应减少"},
    {k:"Friedman", v:"χ²_F = 12/(n·k(k+1)) · ΣRⱼ² − 3n(k+1)", note:"按行内排序赋秩，df = k − 1"},
    {k:"正态近似", v:"z = (U − n₁n₂/2) / √(n₁n₂(n₁+n₂+1)/12)", note:"Mann-Whitney 大样本近似，含并列秩校正"}
  ],
  charts:[
    {k:"多组箱线图", v:"与 ANOVA 共用，展示各组分布与中位数", note:"复用 svgBox / svgBoxMulti"},
    {k:"秩次分布图", v:"各组秩次的分布对比", note:"体现非参数检验「只看次序不看数值」的特点"},
    {k:"配对差值图", v:"Wilcoxon / Friedman 用，展示差值方向与幅度", note:"复用 svgScatterPaired 或 svgHist"}
  ],

    {k:"分析", v:"统计量 = ?，p = ?，是否拒绝「分布位置相同」", note:"非参数检验比较的是分布位置，非均值"},
    {k:"分析", v:"效应量解读实际意义", note:"与参数检验一样要报效应量"},
    {k:"警示", v:"前提：观测独立、变量至少为顺序尺度、分布形状相似", note:"分布形状差异大时结论解读要谨慎"},
    {k:"建议", v:"与对应的参数检验结论对照；结论不一致时优先报告非参数结果", note:"数据不正态时非参数更可信"}
  ],

    {fn:"rankAll(values)", what:"混合排序赋秩，处理并列（取平均秩）", ref:"所有非参数检验的基础"},
    {fn:"mannWhitneyU(a, b)", what:"计算 U、z、p（精确或正态近似）、秩双列相关 r", ref:"替代独立样本 t 检验"},
    {fn:"kruskalWallisH(groups)", what:"计算 H、df、p、ε²", ref:"替代单因素 ANOVA"},
    {fn:"wilcoxonSignedRank(a, b)", what:"计算 W、z、p，处理零差值与并列秩", ref:"替代配对 t 检验"},
    {fn:"friedmanTest(matrix)", what:"按行赋秩，计算 χ²_F、df、p、Kendall's W", ref:"替代重复测量 ANOVA"},

function $(id){ return document.getElementById(id); }
function escT(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

var state = { ds:null, src:"", srcName:"", reco:null, analysis:null, lastHtml:"" };
var __toastT = null;
function toast(msg){
  var t=$("toast");
  if(!t){ t=document.createElement("div"); t.id="toast";
    t.style.cssText="position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(16px);background:#262B31;color:#fff;padding:11px 22px;border-radius:4px;font-size:14px;z-index:99;opacity:0;transition:all .25s;box-shadow:0 4px 14px rgba(0,0,0,.2);pointer-events:none;max-width:86vw;text-align:center;font-weight:500";
    document.body.appendChild(t); }
  t.textContent=msg;
  requestAnimationFrame(function(){ t.style.opacity="1"; t.style.transform="translateX(-50%) translateY(0)"; });
  if(__toastT) clearTimeout(__toastT);
  __toastT=setTimeout(function(){ t.style.opacity="0"; t.style.transform="translateX(-50%) translateY(16px)"; }, 2600);
}

/* 方法分组（ANALYSES 的 key → 组） */
var GROUPS = [
  { t:"描述类", keys:["desc","clean","group","multi"] },
  { t:"比较类", keys:["ttest","anova","chi2","nonparam"] },
  { t:"关系类", keys:["regress"] },
  { t:"预测类", keys:["ts","sampling","index"] }
];
var SHELL_KEYS = {};

function autoDetect(){
  var keys=Object.keys(ANALYSES), i;
  for(i=0;i<keys.length;i++){ if(ANALYSES[keys[i]].detect(state.ds)) return keys[i]; }
  return null;
}

function applyDS(ds, src, srcName, reco){
  state.ds=ds; state.src=src; state.srcName=srcName;
  state.reco=(ds && reco)? reco : (ds? autoDetect() : null);
  state.analysis=state.reco;
  state.lastHtml="";
  renderLeft();
  renderAnalysis();
  $("result").innerHTML='<div class="ws-empty">已就绪。中间栏选方法、调参数后点「开始分析」，结果在此展示。</div>';
}

function renderLeft(){
  var meta=$("srcMeta"), vl=$("varList"), sec=$("varSecLbl");
  if(!state.ds){
    meta.classList.add("hidden"); vl.innerHTML=""; sec.style.display="none";
    return;
  }
  var ds=state.ds, cos=colOptions(ds);
  meta.classList.remove("hidden");
  meta.innerHTML="<b>"+escT(state.srcName)+"</b> · "+escT(state.src)+"<br>"+ds.rows.length+" 行 × "+ds.headers.length+" 列";
  sec.style.display="block";
  var h="";
  cos.forEach(function(o){
    h+='<div class="var-item"><span class="v-dot" style="background:'+(o.num?"#1D6FA3":"#1E7A50")+'"></span>'
      +'<span class="v-name">'+escT(o.name)+'</span><span class="v-type">'+(o.num?"数值":"分类")+'</span></div>';
  });
  h+='<div class="var-note">蓝点 = 数值型（可计算）· 绿点 = 分类型（可分组）</div>';
  vl.innerHTML=h;
}

function renderAnalysis(){
  var box=$("anGroups"), empty=$("anEmpty");
  if(!state.ds){
    box.innerHTML=""; empty.classList.remove("hidden"); $("cfgWrap").classList.add("hidden");
    return;
  }
  empty.classList.add("hidden");
  var ds=state.ds, h="", has=false;
  GROUPS.forEach(function(g){
    var cards="";
    g.keys.forEach(function(k){
      var a=ANALYSES[k]; if(!a) return;
      var isShell=!!SHELL_KEYS[k];
      var ok=a.detect(ds); has=true;
      var cls=isShell?"shell":(ok?"ok":"no");
      var txt=isShell?"待接入":(ok?"可用":"数据不足");
      cards+='<button type="button" class="an-card" data-k="'+k+'">'
        +'<span class="ic">'+a.icon+'</span>'
        +'<span class="nm">'+escT(a.name)+'<span class="short">'+escT(a.short)+'</span></span>'
        +'<span class="badge '+cls+'">'+txt+'</span></button>';
    });
    if(cards) h+='<div class="an-group"><div class="an-group-t">'+g.t+'</div>'+cards+'</div>';
  });
  box.innerHTML=h;
  if(state.reco && ANALYSES[state.reco] && ANALYSES[state.reco].detect(ds)){
    renderConfig(state.reco);
  } else {
    state.analysis=null; $("cfgWrap").classList.add("hidden");
  }
}

function renderConfig(k){
  var a=ANALYSES[k];
  if(!a || !state.ds){ return; }
  if(!a.detect(state.ds)){
    toast("当前数据不满足「"+a.name+"」的适用条件（"+a.fit+"）");
    return;
  }
  state.analysis=k;
  var btns=$("anGroups").querySelectorAll(".an-card");
  Array.prototype.forEach.call(btns, function(b){ b.classList.toggle("sel", b.getAttribute("data-k")===k); });
  $("cfgFields").innerHTML=a.config(state.ds);
  $("cfgFields").querySelectorAll("select, input").forEach(function(el){ el.style.minHeight="40px"; });
  var typeSel=$("cfg_type");
  if(typeSel) typeSel.addEventListener("change", function(){ syncConfigFields(k); });
  syncConfigFields(k);
  $("cfgWrap").classList.remove("hidden");
}

function setConfigVisible(id, visible){
  var el=$(id); if(el) el.style.display=visible ? "" : "none";
}

function syncConfigFields(k){
  var typeSel=$("cfg_type"), type=typeSel?typeSel.value:"";
  if(k==="ttest"){
    setConfigVisible("cfg_indDiv", type==="ind");
    setConfigVisible("cfg_pairedDiv", type==="paired");
    setConfigVisible("cfg_oneDiv", type==="one");
    setConfigVisible("cfg_welchRow", type==="ind");
  } else if(k==="chi2"){
    setConfigVisible("cfg_indDiv2", type==="ind");
    setConfigVisible("cfg_fitDiv", type==="fit");
    setConfigVisible("cfg_yatesRow", type==="ind");
    setConfigVisible("cfg_chiEffRow", type==="ind");
  } else if(k==="nonparam"){
    setConfigVisible("cfg_mwDiv", type==="mw");
    setConfigVisible("cfg_kwDiv", type==="kw");
    setConfigVisible("cfg_wxDiv", type==="wilcoxon");
    setConfigVisible("cfg_frDiv", type==="friedman");
    Array.prototype.forEach.call($("cfgFields").querySelectorAll(".np-option"), function(el){
      el.style.display=(type==="mw"||type==="wilcoxon") ? "" : "none";
    });
  }
}

function readCfg(){
  var cfg={}, els=$("cfgFields").querySelectorAll("[id^='cfg_']");
  els.forEach(function(el){
    var name=el.id.slice(4);
    if(el.tagName==="SELECT" && el.multiple){ cfg[name]=[].slice.call(el.selectedOptions).map(function(o){return o.value;}); }
    else cfg[name]=el.value;
  });
  return cfg;
}

function runAnalysis(){
  if(!state.ds){ toast("请先加载数据"); return; }
  if(!state.analysis){ toast("请先在中间栏选择一个分析方法"); return; }
  var a=ANALYSES[state.analysis], cfg=readCfg(), res;
  try{ res=a.run(state.ds, cfg); }
  catch(e){ toast("计算失败："+(e&&e.message ? e.message : String(e))); return; }
  var html=a.render(state.ds, cfg, res);
  state.lastHtml=html;
  $("result").classList.remove("ws-empty");
  $("result").innerHTML=html;
  $("result").classList.toggle("no-metric", !$("optMetric").checked);
  $("result").classList.toggle("no-chart", !$("optChart").checked);
  $("result").classList.toggle("no-formula", !$("optFormula").checked);
  $("result").classList.toggle("no-finding", !$("optFinding").checked);
  $("result").scrollTop=0;
}

function loadFile(file){
  if(!file) return;
  if(file.size>2*1024*1024){ toast("文件超过 2MB，请拆分后上传"); return; }
  var rd=new FileReader();
  rd.onload=function(){
    var raw=String(rd.result||""), ds;
    try{ ds=parseCSV(raw); }catch(e){ toast("CSV 解析失败："+e.message); return; }
    if(!ds.headers.length || ds.rows.length<1){ toast("未识别到数据：需第一行表头 + 至少 1 行数据"); return; }
    applyDS(ds, "本地文件", file.name, null);
  };
  rd.onerror=function(){ toast("文件读取失败，请重试"); };
  rd.readAsText(file, "utf-8");
}

function loadSample(k){
  var s=SAMPLES[k];
  if(!s){ toast("未找到示例"); return; }
  if(s.placeholder){ toast("该示例需外部采集工具，暂不可用"); return; }
  var ds=parseCSV(s.csv);
  applyDS(ds, "示例 · 实训"+s.no+" · "+s.name, s.name, s.analysis||null);
  var target=(s.analysis && ANALYSES[s.analysis] && ANALYSES[s.analysis].detect(ds))? s.analysis : state.reco;
  if(target && ANALYSES[target] && ANALYSES[target].detect(ds)){
    setTimeout(function(){ renderConfig(target); setTimeout(runAnalysis, 80); }, 60);
  }
}

  document.body.appendChild(aEl); aEl.click(); document.body.removeChild(aEl);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  toast("报告已导出为独立 HTML（可打印 / 投影）");
}

function csvCell(s){
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function exportCSV(){
  if(!state.lastHtml){ toast("暂无结果可导出，请先运行一次分析"); return; }
  var a=ANALYSES[state.analysis];
  var title=(a?a.name:"分析结果")+" · "+state.srcName;
  var tmp=document.createElement("div"); tmp.innerHTML=state.lastHtml;
  var csv="\uFEFF";
  var metrics=tmp.querySelectorAll(".metric");
  if(metrics.length){
    csv+="指标,值\n";
    metrics.forEach(function(m){
      var label=m.querySelector(".m-label");
      var value=m.querySelector(".m-value");
      if(label && value) csv+=csvCell(label.innerText.trim())+","+csvCell(value.innerText.trim())+"\n";
    });
  }
  var tables=tmp.querySelectorAll("table.pre-tbl");
  if(tables.length && csv.length>1) csv+="\n";
  tables.forEach(function(tbl){
    tbl.querySelectorAll("tr").forEach(function(tr){
      var cells=tr.querySelectorAll("th,td");
      var line=Array.prototype.map.call(cells, function(c){ return csvCell(c.innerText.trim()); }).join(",");
      csv+=line+"\n";
    });
  });
  if(csv.length<=1){ toast("当前结果无可导出的数据"); return; }
  var blob=new Blob([csv], {type:"text/csv;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var aEl=document.createElement("a");
  aEl.href=url; aEl.download=title.replace(/[\\\/:*?"<>|]/g,"_")+".csv";
  document.body.appendChild(aEl); aEl.click(); document.body.removeChild(aEl);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  toast("结果数据已导出为 CSV（可用 Excel 打开编辑）");
}

/* ---------- 事件绑定与初始化 ---------- */
function init(){
  // 上传
  $("uploadBox").addEventListener("click", function(){ $("fileInput").click(); });
  $("btnUploadTop").addEventListener("click", function(){ $("fileInput").click(); });
  $("fileInput").addEventListener("change", function(e){
    var f=e.target.files&&e.target.files[0]; if(f) loadFile(f); e.target.value="";
  });
  // 拖放
  $("uploadBox").addEventListener("dragover", function(e){ e.preventDefault(); });
  $("uploadBox").addEventListener("drop", function(e){
    e.preventDefault(); var f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) loadFile(f);
  });
  // 示例
  var sh='<div class="sample-item"><div class="no">暂无</div><div class="nm">加载示例数据</div></div>';
  var sh2="", si=0;
  Object.keys(SAMPLES).forEach(function(k){
    var s=SAMPLES[k];
    if(s.placeholder) return;
    var more=(si>=3?" sample-more":"");
    sh2+='<div class="sample-item'+more+'" data-sample="'+k+'"><div class="no">实训 '+s.no+'</div><div class="nm">'+escT(s.name)+'</div><span class="tp">'+escT((s.analysis&&ANALYSES[s.analysis]?ANALYSES[s.analysis].name:"数据分析"))+'</span></div>';
    si++;
  });
  $("sampleList").innerHTML=sh2||sh;
  $("sampleList").addEventListener("click", function(e){
    var it=e.target.closest(".sample-item"); if(it && it.getAttribute("data-sample")) loadSample(it.getAttribute("data-sample"));
  });
  // 示例数据折叠（默认只显前 3，展开显全部）
  $("sampleFold").addEventListener("click", function(){
    var open = $("sampleFold").classList.toggle("open");
    $("sampleList").classList.toggle("open", open);
    $("sampleFold").setAttribute("aria-expanded", open);
  });
  // 数据源
  $("btnDB").addEventListener("click", showDatabases);
  $("btnDBTop").addEventListener("click", showDatabases);
  $("btnOct").addEventListener("click", showOctopus);
  $("btnOctTop").addEventListener("click", showOctopus);
  $("modalMask").addEventListener("click", function(e){ if(e.target===this) closeModal(); });
  // 分析
  $("anGroups").addEventListener("click", function(e){
    var b=e.target.closest(".an-card"); if(b && b.getAttribute("data-k")) renderConfig(b.getAttribute("data-k"));
  });
  $("btnRun").addEventListener("click", runAnalysis);
  $("btnExport").addEventListener("click", exportReport);
  $("btnCSV").addEventListener("click", exportCSV);
  // 初始空态
  renderLeft(); renderAnalysis();
}
init();
</script>
