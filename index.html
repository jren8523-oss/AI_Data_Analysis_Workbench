<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据分析工作台 · 雏形</title>
<style>
:root{--brand:#1D6FA3;--brand-dark:#14517A;--brand-light:#E8F1F8;--accent:#D89A1E;--ok:#1E7A50;--bad:#B4382C;--purple:#5B4AA8;--teal:#2C7A7B;--gray:#6B7480;--text:#262B31;--line:#D9E0E8;--bg:#F5F3EE;--card:#fff;--rule:#D9E0E8;--serif:"Source Han Serif SC","Noto Serif CJK SC","STZhongsong","SimSun",Georgia,"Times New Roman",serif;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Microsoft YaHei","微软雅黑","PingFang SC","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.7}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- 顶栏 ---------- */
.topbar{height:56px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:9px}
.brand .logo{width:26px;height:26px;background:var(--brand);border-radius:6px;display:flex;align-items:center;justify-content:center}
.brand .logo svg{width:15px;height:15px;color:#fff}
.brand .nm{font-size:15px;font-weight:700;letter-spacing:.5px}
.brand .ver{font-size:11px;color:var(--gray);font-weight:400;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:1px 7px;margin-left:2px}
.top-actions{display:flex;gap:8px}
.tb-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--brand);background:transparent;border:1px solid var(--line);border-radius:4px;padding:7px 14px;min-height:36px;font-weight:500;transition:all .15s}
.tb-btn:hover{background:var(--brand-light);border-color:var(--brand)}
.tb-btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.tb-btn.primary:hover{background:var(--brand-dark)}
.tb-btn svg{width:15px;height:15px}

/* ---------- 三栏工作区 ---------- */
.workbench{display:grid;grid-template-columns:250px 1fr 1.2fr;height:calc(100vh - 56px)}
.col{overflow-y:auto;padding:16px 18px;border-right:1px solid var(--line)}
.col:last-child{border-right:none}
.col-h{font-size:13px;font-weight:700;color:var(--brand-dark);margin-bottom:14px;display:flex;align-items:center;gap:7px;justify-content:space-between}
.col-h svg{width:16px;height:16px;color:var(--brand);flex:0 0 16px}
.col-h .l{display:flex;align-items:center;gap:7px}
.sec-lbl{font-size:11px;color:var(--gray);font-weight:600;letter-spacing:1px;margin:14px 0 6px}
.sec-lbl.fold-head{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:none;cursor:pointer;text-align:left;padding:0;font-size:11px;font-weight:600;color:var(--gray);letter-spacing:1px}
.sec-lbl.fold-head:hover{color:var(--brand)}
.sec-lbl.fold-head .fold-arrow{width:14px;height:14px;color:var(--gray);transition:transform .18s;flex:0 0 auto}
.sec-lbl.fold-head.open .fold-arrow{transform:rotate(90deg)}
.fold-body .sample-more{display:none}
.fold-body.open .sample-more{display:block}

/* ---------- 左栏：数据 ---------- */
.upload-box{border:1.5px dashed #AEBDCC;border-radius:6px;padding:22px 14px;text-align:center;cursor:pointer;background:#FCFDFE;transition:all .15s}
.upload-box:hover{border-color:var(--brand);background:var(--brand-light)}
.upload-box svg{width:30px;height:30px;color:var(--brand);margin-bottom:6px}
.upload-box .t{font-size:13.5px;font-weight:700}
.upload-box .s{font-size:11.5px;color:var(--gray);margin-top:2px}
.sample-item{border:1px solid var(--line);border-radius:4px;padding:8px 11px;font-size:12.5px;cursor:pointer;background:#fff;margin-bottom:7px;transition:all .15s}
.sample-item:hover{border-color:var(--brand);background:#FBFCFE}
.sample-item .no{font-size:10.5px;font-weight:700;color:var(--brand);letter-spacing:.5px}
.sample-item .nm{font-weight:600;margin-top:1px}
.sample-item .tp{font-size:10.5px;color:var(--ok);background:#EDF5F0;border-radius:2px;padding:0 6px;margin-top:4px;display:inline-block;font-weight:600}
.src-link{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:8px 11px;margin-bottom:7px;cursor:pointer;background:#fff;transition:all .15s;text-align:left;width:100%}
.src-link:hover{border-color:var(--brand);background:#FBFCFE}
.src-link .go{color:var(--brand);font-size:11.5px;font-weight:600}
.var-list{margin-top:6px}
.var-item{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:4px 0}
.v-dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.v-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v-type{font-size:10.5px;color:var(--gray)}
.var-note{font-size:11px;color:var(--gray);margin-top:8px;line-height:1.6}
.src-meta{font-size:12px;color:var(--gray);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:8px 11px;margin-bottom:10px}

/* ---------- 中栏：分析 ---------- */
.an-group{margin-bottom:16px}
.an-group-t{font-size:11px;color:var(--gray);font-weight:600;letter-spacing:1px;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.an-card{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);border-radius:5px;padding:9px 12px;margin-bottom:7px;background:#fff;transition:all .15s}
.an-card:hover{border-color:var(--brand);background:#FBFCFE}
.an-card.sel{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand);background:var(--brand-light)}
.an-card .ic{width:20px;height:20px;color:var(--brand);flex:0 0 20px}
.an-card .ic svg{width:20px;height:20px}
.an-card .nm{font-size:13.5px;font-weight:600;flex:1;min-width:0}
.an-card .nm .short{display:block;font-size:11px;color:var(--gray);font-weight:400;margin-top:1px}
.badge{font-size:10.5px;font-weight:600;border-radius:3px;padding:2px 7px;flex:0 0 auto;letter-spacing:.3px}
.badge.ok{background:var(--brand-light);color:var(--brand)}
.badge.no{background:#EEF0F3;color:var(--gray)}
.badge.shell{background:#FBF3E2;color:#9A6A12}
.an-empty{font-size:12.5px;color:var(--gray);background:var(--card);border:1px dashed var(--line);border-radius:6px;padding:20px 16px;text-align:center;line-height:1.7}
.cfg-wrap{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px}
.cfg-wrap .ttl{font-size:13px;font-weight:700;color:var(--brand-dark);margin-bottom:10px}
.cfg-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.cfg-row label{font-size:13px;font-weight:600;color:var(--brand-dark);min-width:90px}
.cfg-row select,.cfg-row input[type=number]{font-family:inherit;font-size:14px;padding:8px 10px;border:1.5px solid var(--line);border-radius:3px;background:#fff;min-height:40px;min-width:160px;color:var(--text)}
.cfg-row select:focus,.cfg-row input:focus{outline:none;border-color:var(--brand)}
.hint{font-size:12px;color:var(--gray)}
.out-opts{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.out-ttl{font-size:13px;font-weight:700;color:var(--brand-dark);margin-bottom:8px}
.out-row{display:flex;gap:16px;flex-wrap:wrap}
.out-item{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--text);cursor:pointer;user-select:none}
.out-item input{width:15px;height:15px;accent-color:var(--brand);cursor:pointer}
.run-btn{display:inline-flex;align-items:center;gap:7px;background:var(--brand);color:#fff;border:none;border-radius:4px;padding:10px 20px;font-size:14px;font-weight:600;min-height:42px;margin-top:6px}
.run-btn:hover{background:var(--brand-dark)}
.run-btn svg{width:16px;height:16px}

/* ---------- 右栏：结果 ---------- */
.ws-empty{font-size:12.5px;color:var(--gray);background:var(--card);border:1px dashed var(--line);border-radius:6px;padding:26px 18px;text-align:center;line-height:1.8}
#result.no-metric .metric{display:none}
#result.no-chart .chart-box{display:none}
#result.no-formula .formula-card{display:none}
#result.no-finding .finding{display:none}

/* ---------- 弹窗 ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(20,26,33,.42);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border-radius:8px;max-width:560px;width:100%;max-height:82vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,.18)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h .t{font-size:15px;font-weight:700}
.modal-x{background:transparent;border:none;font-size:22px;color:var(--gray);cursor:pointer;line-height:1;padding:2px 6px}
.modal-b{padding:16px 20px 20px}
.db-item{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #EEF2F6;padding:10px 2px}
.db-item:last-child{border-bottom:none}
.db-item .n{font-size:13.5px}
.db-item .n small{display:block;font-size:11px;color:var(--gray)}
.db-item a{color:var(--brand);font-size:12.5px;text-decoration:none;font-weight:600;flex:0 0 auto}
.db-item a:hover{text-decoration:underline}
.oct-step{display:flex;gap:10px;padding:8px 0;font-size:13px;line-height:1.7}
.oct-step .no{flex:0 0 22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.oct-step .tx{flex:1;min-width:0}

/* ---------- 结果样式（复用现有引擎输出） ---------- */
/* ---------- 壳子模式：能力已设计、算法待接入 ---------- */
.shell-flag{display:flex;gap:10px;align-items:flex-start;background:#FFF7E6;border:1px solid #F2D8A7;border-radius:3px;padding:12px 16px;margin-bottom:14px;font-size:13px;line-height:1.75;color:#7A5A12}
.shell-flag svg{flex:0 0 auto;width:17px;height:17px;color:#DD8B00;margin-top:3px}
.shell-flag b{font-weight:800}
.spec-list,.todo-list{list-style:none;padding:0;margin:0}
.spec-item{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.7}
.spec-item:last-child{border-bottom:none}
.spec-k{flex:0 0 132px;font-weight:700;color:#14517A;font-size:12px;letter-spacing:.2px}
.spec-v{flex:1;min-width:0;color:var(--text)}
.spec-v small{display:block;color:var(--gray);font-size:11.5px;margin-top:2px;line-height:1.65}
.todo-item{display:flex;gap:10px;padding:8px 0;font-size:13px;line-height:1.7;align-items:flex-start}
.todo-box{flex:0 0 auto;width:13px;height:13px;border:1.5px solid #C5CDD6;border-radius:2px;margin-top:4px}
.todo-item b{font-family:'Consolas','Courier New',monospace;font-size:12.5px;color:#14517A}
.todo-item small{display:block;color:var(--gray);font-size:11.5px;margin-top:2px}
.pre-tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0 4px}
.pre-tbl th{background:#F1F5F9;color:#14517A;font-weight:700;text-align:left;padding:7px 10px;border-bottom:2px solid var(--line)}
.pre-tbl td{padding:6px 10px;border-bottom:1px solid #EEF2F6}
.pre-tbl td.num{text-align:right;font-family:Georgia,"Times New Roman",serif}
.pre-ok{color:#1E8E5A;font-weight:700}
.pre-bad{color:#C0392B;font-weight:700}
@media (max-width:768px){
  html,body{height:auto}
  .topbar{height:auto;min-height:56px;padding:8px 12px;gap:8px;flex-wrap:wrap}
  .top-actions{margin-left:auto}
  .tb-btn{padding:7px 9px}
  .workbench{display:block;height:auto;min-height:calc(100vh - 56px)}
  .col{overflow:visible;padding:14px 12px;border-right:none;border-bottom:1px solid var(--line)}
  .col:last-child{border-bottom:none}
  .cfg-row label{min-width:0;flex-basis:100%}
  .cfg-row select,.cfg-row input[type=number],.cfg-row input[type=text]{width:100%;min-width:0}
  .spec-item{flex-direction:column;gap:2px}
  .spec-k{flex:0 0 auto}
}

/* ---------- Step3 结果 ---------- */
.result-toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.result-toolbar .rt-status{font-size:13px;color:var(--ok);font-weight:600;display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.result-toolbar .rt-status svg{width:16px;height:16px}
.res-block{background:var(--card);border:1px solid var(--line);border-radius:4px;
  padding:20px 22px;margin-bottom:16px;scroll-margin-top:12px}
.res-block .rb-title{font-size:15px;font-weight:700;color:var(--brand-dark);margin-bottom:12px;
  display:flex;align-items:center;gap:8px}
.res-block .rb-title .rb-no{background:var(--brand);color:#fff;font-size:12px;font-weight:700;
  width:22px;height:22px;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 22px}
.res-block .rb-title svg{width:18px;height:18px;color:var(--brand);flex:0 0 18px}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:6px}
.metric{background:#FAFBFC;border:1px solid var(--line);border-radius:3px;padding:10px 12px}
.metric .m-label{font-size:11.5px;color:var(--gray);font-weight:600}
.metric .m-value{font-family:Georgia,"Times New Roman",serif;font-size:18px;font-weight:700;color:var(--brand-dark);line-height:1.35}
.metric .m-unit{font-size:11.5px;color:var(--gray);margin-left:3px;font-weight:400}
.metric.hl{background:var(--brand-light);border-color:var(--brand)}
.metric.hl .m-value{color:var(--brand)}
.metric.warn{background:#FBF7EE;border-color:#E8D5AC}
.metric.warn .m-value{color:#9A6A12}
.chart-box{margin:10px 0 4px}
.chart-box svg{width:100%;height:auto;display:block}
.chart-cap{font-size:12px;color:var(--gray);margin-top:4px}
.formula-card{background:#F8F9FA;border-left:3px solid var(--accent);border-radius:2px;
  padding:12px 16px;margin:10px 0;font-size:13.5px}
.formula-card .f-label{font-size:11px;font-weight:700;color:#9A6A12;letter-spacing:1px;margin-bottom:3px}
.formula-card .f-expr{font-weight:700;color:var(--text);font-family:"Cambria Math","STIXGeneral",Georgia,serif;font-size:14.5px}
.formula-card .f-sub{color:#4A5568;font-size:13px;margin-top:2px}
.formula-card .f-res{color:var(--brand);font-weight:700;margin-top:2px}
.finding{display:flex;gap:10px;padding:9px 12px;border-radius:2px;margin:7px 0;align-items:flex-start;font-size:13.5px}
.finding .f-badge{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:2px;margin-top:2px}
.finding .f-body{flex:1}
.finding .f-title{font-weight:700}
.f-fact{background:#F0F5FA}.f-fact .f-badge{background:var(--brand);color:#fff}
.f-anl{background:#FAF5EA}.f-anl .f-badge{background:#C88A10;color:#fff}
.f-sug{background:#EDF5F0}.f-sug .f-badge{background:var(--ok);color:#fff}
.f-warn{background:#FAEEEC}.f-warn .f-badge{background:var(--bad);color:#fff}
.prompt-box{background:#12293E;border-radius:3px;padding:16px 18px;margin:10px 0;color:#E8F1F8}
.prompt-box .pb-label{font-size:11.5px;font-weight:700;color:var(--accent);letter-spacing:1.5px;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.prompt-box .pb-label svg{width:15px;height:15px}
.prompt-box .pb-text{font-size:13px;line-height:1.8;white-space:pre-wrap;font-family:"Consolas","Courier New",monospace}
.prompt-box .pb-copy{margin-top:10px;font-size:12px;background:rgba(255,255,255,.1);color:#fff;
  border:1px solid rgba(255,255,255,.28);border-radius:2px;padding:6px 14px;min-height:36px;font-weight:600}
.prompt-box .pb-copy:hover{background:rgba(255,255,255,.2)}
.prompt-box .pb-copied{color:#7FD8A8;font-size:12px;margin-left:10px}
.qa-note{font-size:12px;color:var(--gray);margin-top:10px;display:flex;gap:8px;align-items:center}
.qa-note svg{width:15px;height:15px;color:var(--ok);flex:0 0 15px}
.warn-box{background:#FAEEEC;border:1px solid #E9C2BA;border-radius:2px;padding:12px 16px;
  margin:10px 0;font-size:13px;display:flex;gap:10px}
.warn-box svg{width:18px;height:18px;color:var(--bad);flex:0 0 18px;margin-top:2px}


</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="3" height="8" rx=".8" fill="currentColor" stroke="none"/><rect x="10.5" y="6" width="3" height="13" rx=".8" fill="currentColor" stroke="none"/><rect x="17" y="3" width="3" height="16" rx=".8" fill="currentColor" stroke="none"/></svg></span>
    <span class="nm">数据分析工作台</span>
    <span class="ver">雏形 v0.1</span>
  </div>
  <div class="top-actions">
    <button class="tb-btn primary" id="btnUploadTop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>上传数据</button>
    <button class="tb-btn" id="btnDBTop">公开数据库</button>
    <button class="tb-btn" id="btnOctTop">八爪鱼采集</button>
  </div>
</header>

<main class="workbench">
  <!-- 左栏：数据 -->
  <section class="col">
    <div class="col-h"><span class="l">数据</span></div>
    <div class="upload-box" id="uploadBox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <div class="t">拖入 CSV 或点击上传</div>
      <div class="s">第一行表头 · 数据不出浏览器</div>
    </div>
    <input type="file" id="fileInput" accept=".csv,text/csv" class="hidden">
    <button type="button" class="sec-lbl fold-head" id="sampleFold" aria-expanded="false"><span>示例数据</span><svg class="fold-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
    <div id="sampleList" class="fold-body"></div>
    <div class="sec-lbl">数据源</div>
    <button class="src-link" id="btnDB"><span>公开数据库</span><span class="go">跳转 →</span></button>
    <button class="src-link" id="btnOct"><span>八爪鱼采集 · 教程</span><span class="go">查看 →</span></button>
    <div class="sec-lbl" id="varSecLbl" style="display:none">变量列表</div>
    <div class="src-meta hidden" id="srcMeta"></div>
    <div class="var-list" id="varList"></div>
  </section>

  <!-- 中栏：分析 -->
  <section class="col">
    <div class="col-h"><span class="l">分析</span></div>
    <div class="an-empty" id="anEmpty">加载数据后，这里会列出全部分析方法，并按数据自动标记「可用 / 数据不足」。</div>
    <div id="anGroups"></div>
    <div class="cfg-wrap hidden" id="cfgWrap">
      <div class="ttl">参数设置</div>
      <div id="cfgFields"></div>
      <div class="out-opts">
        <div class="out-ttl">输出选项</div>
        <div class="out-row">
          <label class="out-item"><input type="checkbox" id="optMetric" checked>指标卡</label>
          <label class="out-item"><input type="checkbox" id="optChart" checked>图表</label>
          <label class="out-item"><input type="checkbox" id="optFormula">公式</label>
          <label class="out-item"><input type="checkbox" id="optFinding" checked>解读</label>
        </div>
      </div>
      <button class="run-btn" id="btnRun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>开始分析</button>
    </div>
  </section>

  <!-- 右栏：结果 -->
  <section class="col">

<script>
"use strict";
var C = {brand:"#1D6FA3", brandD:"#14517A", accent:"#D89A1E", ok:"#1E8E5A", bad:"#C0392B",
  purple:"#6B46C1", teal:"#2C7A7B", gray:"#8A94A0", text:"#2D3748", line:"#E2E8F0"};

/* ---------- 数字格式化 ---------- */
function fmtNum(v, d){ if(v===null||v===undefined||!isFinite(v)) return "—";
  d = (d===undefined?1:d); return v.toLocaleString("zh-CN",{minimumFractionDigits:0,maximumFractionDigits:d}); }
function fmtPct(v, d){ return (v*100).toFixed(d===undefined?1:d)+"%"; }
function fmtSigned(v, d){ var s=fmtNum(v,d); return (v>0?"+":"")+s; }
function round(v, d){ var p=Math.pow(10,d===undefined?2:d); return Math.round(v*p)/p; }
function sum(a){ return a.reduce(function(s,v){return s+v;},0); }
function mean(a){ return a.length? sum(a)/a.length : NaN; }
function isLikelyTotalColumn(name){ return /^(总|合计|总计)|(?:总数|合计|总计|total|sum)$/i.test(String(name||"").trim()); }

/* =====================================================================
 * 1. CSV 解析（支持引号包裹、逗号、BOM；UTF-8）
 * ===================================================================== */
function parseCSV(text){
  text = text.replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n");
  var rows=[], row=[], cell="", inQ=false, i, c;
  for(i=0;i<text.length;i++){
    c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else inQ=false; }
      else cell+=c;
    } else {
      if(c==='"'){ inQ=true; }
      else if(c===','){ row.push(cell); cell=""; }
      else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=""; }
      else cell+=c;
    }
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  rows = rows.filter(function(r){ return r.some(function(x){ return x.trim()!==""; }); });
  if(rows.length<2) return null;
  var headers = rows[0].map(function(h){ return String(h).trim(); });
  var data = rows.slice(1).map(function(r){
    while(r.length<headers.length) r.push("");
    return headers.map(function(_,k){ return (r[k]!==undefined? String(r[k]).trim() : ""); });
  });
  return {headers:headers, rows:data};
}

/* 单元格数值解析："" → null(缺失)；可解析 → number；否则 NaN(文本) */
function parseNum(s){
  if(s===null||s===undefined) return null;
  var t=String(s).trim();
  if(t==="") return null;
  t=t.replace(/,/g,"").replace(/[¥￥]/g,"").replace(/\s+/g,"");
  if(t==="-"||t==="--"||t==="NA"||t==="N/A"||t==="null") return null;
  // 严格数字格式：残缺日期（2024-2-30）与日期串不得被 parseFloat 截断吞掉
  if(!/^[-+]?(\d+(\.\d+)?|\.\d+)$/.test(t)) return NaN;
  var v=parseFloat(t);
  return isNaN(v)? NaN : v;
}
function isNumCol(rows, k){
  var n=0, ok=0;
  for(var i=0;i<rows.length;i++){ var v=parseNum(rows[i][k]); if(v!==null){ n++; if(!isNaN(v)) ok++; } }
  return n>0 && ok/n>=0.85;
}
function colValues(rows, k){ // 数值化后的数组（null 跳过）
  var out=[];
  for(var i=0;i<rows.length;i++){ var v=parseNum(rows[i][k]); if(v!==null&&!isNaN(v)) out.push(v); }
  return out;
}

/* =====================================================================
 * 2. 描述统计引擎（口径对齐教材：样本方差 ddof=1、众数取最小、Excel 分位数）
 * ===================================================================== */
function quantileSorted(s, p){
  var pos=(s.length-1)*p, lo=Math.floor(pos), hi=Math.ceil(pos);
  return s[lo]+(s[hi]-s[lo])*(pos-lo);
}
function describe(arr){
  var n=arr.length, s=arr.slice().sort(function(a,b){return a-b;}), i, m=sum(s)/n;
  var median = n%2? s[(n-1)/2] : (s[n/2-1]+s[n/2])/2;
  var freq={}, mode=null, mf=0, k;
  for(i=0;i<n;i++){ freq[s[i]]=(freq[s[i]]||0)+1; }
  for(k in freq){ if(freq[k]>mf){ mf=freq[k]; mode=parseFloat(k); } }
  var min=s[0], max=s[n-1], range=max-min;
  var q1=quantileSorted(s,0.25), q3=quantileSorted(s,0.75), iqr=q3-q1;
  var varr=0, m3=0, m4=0;
  for(i=0;i<n;i++){ var d=s[i]-m; varr+=d*d; m3+=d*d*d; m4+=d*d*d*d; }
  var variance=varr/(n-1), std=Math.sqrt(variance), cv=m? std/m : NaN;
  var skew = std>0? (m3/n)/(std*std*std) : NaN;
  var kurt = std>0? (m4/n)/(std*std*std*std)-3 : NaN;
  return {n:n,min:min,max:max,range:range,mean:m,median:median,mode:mode,
    q1:q1,q3:q3,iqr:iqr,variance:variance,std:std,cv:cv,skew:skew,kurt:kurt,sum:m*n};
}

/* =====================================================================
 * 3. 相关与回归（最小二乘一元线性回归 + 皮尔逊 r）
 * ===================================================================== */
function linreg(xs, ys){
  var n=Math.min(xs.length,ys.length), i, mx=mean(xs), my=mean(ys);
  var sxy=0, sxx=0, syy=0;
  for(i=0;i<n;i++){ var dx=xs[i]-mx, dy=ys[i]-my; sxy+=dx*dy; sxx+=dx*dx; syy+=dy*dy; }
  var b=sxx!==0? sxy/sxx : NaN, a=my-b*mx;
  var r=Math.sqrt(sxx)*Math.sqrt(syy)!==0? sxy/Math.sqrt(sxx*syy) : NaN;
  var r2=r*r;
  function predict(x0){ return a+b*x0; }
  return {n:n,a:a,b:b,r:r,r2:r2,predict:predict,meanX:mx,meanY:my};
}
function corrStrength(r){
  var a=Math.abs(r);
  if(a>=0.8) return "高度相关";
  if(a>=0.5) return "显著相关";
  if(a>=0.3) return "低度相关";
  return "弱相关（几乎不相关）";
}

/* =====================================================================
 * 4. 时间序列分析（发展水平/增长量/环比定基速度/几何平均/趋势方程/预测）
 * ===================================================================== */
function tsAnalysis(ys){
  var n=ys.length, i, first=ys[0], last=ys[n-1];
  var avgLevel=sum(ys)/n;
  var avgGrowth=(last-first)/(n-1);
  var chain=[], fixed=[];
  for(i=1;i<n;i++){ chain.push(ys[i]/ys[i-1]); fixed.push(ys[i]/first); }
  fixed.unshift(1);
  var geoMean=first>0? Math.pow(last/first, 1/(n-1)) : NaN;
  var t=ys.map(function(_,k){return k;});
  var tr=linreg(t, ys);
  return {n:n, first:first, last:last, avgLevel:avgLevel, avgGrowth:avgGrowth,
    chain:chain, fixed:fixed, geoMean:geoMean, trend:tr};
}
function tsForecast(tr, targetT){ return tr.predict(targetT); }

/* =====================================================================
 * 5. 统计指数（拉氏/帕氏综合指数 + 因素分析，口径对齐教材）
 * ===================================================================== */
function indexAnalysis(q0, q1, p0, p1){
  var n=q0.length, i;
  var s00=0, s10=0, s01=0, s11=0;
  for(i=0;i<n;i++){ s00+=q0[i]*p0[i]; s10+=q1[i]*p0[i]; s01+=q0[i]*p1[i]; s11+=q1[i]*p1[i]; }
  var kqL=s00? s10/s00 : NaN,   // 拉氏产量指数 Σq1p0/Σq0p0
      kqP=s01? s11/s01 : NaN,   // 帕氏产量指数 Σq1p1/Σq0p1
      kpL=s00? s01/s00 : NaN,   // 拉氏价格指数 Σq0p1/Σq0p0
      kpP=s10? s11/s10 : NaN,   // 帕氏价格指数 Σq1p1/Σq1p0
      kTotal=s00? s11/s00 : NaN;
  var eQ=s10-s00, eP=s11-s10, eTotal=s11-s00;
  var qEffects=[], pEffects=[], iq=[], ip=[];
  for(i=0;i<n;i++){
    iq.push(q1[i]/q0[i]); ip.push(p1[i]/p0[i]);
    qEffects.push(q1[i]*p0[i]-q0[i]*p0[i]); pEffects.push(q1[i]*p1[i]-q1[i]*p0[i]);
  }
  var relConsistent=Math.abs(kqL*kpP-kTotal)<1e-6;
  var absConsistent=Math.abs(eQ+eP-eTotal)<1e-6;
  return {s00:s00,s10:s10,s01:s01,s11:s11,kqL:kqL,kqP:kqP,kpL:kpL,kpP:kpP,
    kTotal:kTotal,eQ:eQ,eP:eP,eTotal:eTotal,iq:iq,ip:ip,
    qEffects:qEffects,pEffects:pEffects,relConsistent:relConsistent,absConsistent:absConsistent};
}

/* =====================================================================
 * 6. 抽样估计（z=1.96 大样本均值区间 / 比例区间 / 样本量）
 * ===================================================================== */
var Z95=1.96;
function meanInterval(arr){
  var st=describe(arr), se=st.std/Math.sqrt(st.n), margin=Z95*se;
  return {n:st.n, mean:st.mean, std:st.std, se:se, margin:margin,
    lower:st.mean-margin, upper:st.mean+margin, large:st.n>=30};
}
function propInterval(binaries){
  var n=binaries.length, k=binaries.filter(Boolean).length, p=k/n;
  var se=Math.sqrt(p*(1-p)/n), margin=Z95*se;
  return {n:n,k:k,p:p,se:se,margin:margin,lower:p-margin,upper:p+margin,
    np:k, nq:n-k, checkOK:k>=5 && (n-k)>=5};
}
function requiredSampleSize(sigma, E, z){ z=z||Z95; return Math.ceil((z*sigma/E)*(z*sigma/E)); }

/* ===== t 检验 helpers（追加于 requiredSampleSize 之后） ===== */
/* =====================================================================
 * 7.5  t 检验统计函数（独立 / 配对 / 单样本 — Welch 与 Student 可选）
 *      p 值通过正则化不完全 Beta 函数计算（CDF），与 scipy/statsmodels 一致
 * ===================================================================== */
function lGamma(x){
  // Lanczos 近似 — Numerical Recipes 风格
  var cof=[76.18009172947146, -86.50532032941677, 24.01409824083091,
           -1.2317735763244911, 0.00120858097003216, -0.0000053952393844999];
  var y=x, tmp=x+5.5;
  tmp-=(x+0.5)*Math.log(tmp);
  var ser=1.000000000190015;
  for(var j=0;j<6;j++) ser+=cof[j]/++y;
  return -tmp + Math.log(2.5066282746310005*ser/x);
}
function betaIncCF(a,b,x){
  // 连分式 (Lentz) — Regularized incomplete beta function 的连分式部分
  var qab=a+b, qap=a+1, qam=a-1;
  var c=1, d=1-qab*x/qap;
  if(Math.abs(d)<1e-300) d=1e-300;
  d=1/d;
  var h=d;
  for(var m=1;m<=200;m++){
    var m2=2*m;
    var aa=m*(b-m)*x/((qam+m2)*(a+m2));
    d=1+aa*d; if(Math.abs(d)<1e-300) d=1e-300;
    c=1+aa/c; if(Math.abs(c)<1e-300) c=1e-300;
    d=1/d; h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));
    d=1+aa*d; if(Math.abs(d)<1e-300) d=1e-300;
    c=1+aa/c; if(Math.abs(c)<1e-300) c=1e-300;
    d=1/d; var del=d*c; h*=del;
    if(Math.abs(del-1)<3e-10) break;
  }
  return h;
}
function betaInc(a,b,x){
  if(x<=0) return 0;
  if(x>=1) return 1;
  var lbt = lGamma(a+b) - lGamma(a) - lGamma(b)
          + a*Math.log(x) + b*Math.log(1-x);
  var bt  = Math.exp(lbt);
  if(x<(a+1)/(a+b+2)) return bt*betaIncCF(a,b,x)/a;
  return 1 - bt*betaIncCF(b,a,1-x)/b;
}
function normCdf(z){
  // 标准正态 CDF —— Abramowitz & Stegun 7.1.26 近似（精度 ~1e-7）
  var t=1/(1+0.2316419*Math.abs(z));
  var d=0.3989422804014327*Math.exp(-z*z/2);
  var p=d*t*(0.319381530 + t*(-0.356563782 + t*(1.781477937 + t*(-1.821255978 + t*1.330274429))));
  return z>=0 ? 1-p : p;
}
function tDist2tail(t, df){
  // Student-t 双尾 p 值（教材口径 = 不完全 Beta 函数）
  if(df<=0) return NaN;
  if(df>100000) return 2*(1-normCdf(Math.abs(t)));  // 大 df → 正态近似
  var x = df/(df + t*t);
  return betaInc(df/2, 0.5, x);
}
function tDist1tail(t, df){
  // 单尾 p 值（t>0: P(T>t)；t<0: P(T<t)）
  var p2=tDist2tail(t, df);
  return t >= 0 ? p2/2 : 1 - p2/2;
}
function cohenD(a, b, kind){
  // kind: "ind_pooled" | "ind_welch" | "paired" | "one"
  var ma=mean(a), mb=b?mean(b):0;
  var sa=Math.sqrt(variance(a)), sb=b?Math.sqrt(variance(b)):0;
  if(kind==="paired"){
    // a 已经是差值数组
    return mean(a) / Math.sqrt(variance(a));
  }
  if(kind==="one"){ return (ma - b) / sa; }   // b 此时是 μ0
  if(kind==="ind_pooled"){
    var na=a.length, nb=b.length;
    var sp = Math.sqrt(((na-1)*sa*sa + (nb-1)*sb*sb)/(na+nb-2));
    return (ma-mb)/sp;
  }
  // ind_welch
  return (ma-mb)/Math.sqrt((sa*sa+sb*sb)/2);
}

/* ------- t 检验主函数 ------- */
function ttestIndependent(a, b, opts){
  opts=opts||{};
  var welch = !!opts.welch;
  var alts  = !!opts.alts;    // true=双尾 false=单尾（暂不全实现，仅双尾）
  var conf  = opts.conf||0.95;
  var na=a.length, nb=b.length;
  var ma=mean(a), mb=mean(b);
  var sa=a.map(function(x){return (x-ma)*(x-ma);}).reduce(function(s,v){return s+v;},0)/(na-1);
  var sb=b.map(function(x){return (x-mb)*(x-mb);}).reduce(function(s,v){return s+v;},0)/(nb-1);
  sa=Math.sqrt(sa); sb=Math.sqrt(sb);
  var diff=ma-mb;
  var t, df, se;
  if(welch){
    var va=sa*sa/na, vb=sb*sb/nb;
    se=Math.sqrt(va+vb);
    t=diff/se;
    var num=Math.pow(va+vb,2);
    var den=(va*va)/(na-1)+(vb*vb)/(nb-1);
    df=den>0?num/den:NaN;
  } else {
    var sp=Math.sqrt(((na-1)*sa*sa+(nb-1)*sb*sb)/(na+nb-2));
    se=sp*Math.sqrt(1/na+1/nb);
    t=diff/se;
    df=na+nb-2;
  }
  var p=tDist2tail(t, df);
  var cohen=cohenD(a, b, welch?"ind_welch":"ind_pooled");
  // 置信区间（均值差）
  var crit = tCritical(df, conf);   // 双侧 t 临界值
  var ciLower=diff-crit*se, ciUpper=diff+crit*se;
  return {kind:"ind", welch:welch, n1:na, n2:nb, m1:ma, m2:mb, s1:sa, s2:sb,
          diff:diff, se:se, t:t, df:df, p:p, cohensD:cohen,
          ciLower:ciLower, ciUpper:ciUpper, conf:conf, crit:crit};
}
function ttestPaired(a, b){
  var n=Math.min(a.length, b.length);
  var d=[]; for(var i=0;i<n;i++) d.push(a[i]-b[i]);
  var md=mean(d), sd=Math.sqrt(variance(d));
  var se=sd/Math.sqrt(n);
  // sd==0 时 t 与 Cohen's d 自然为 Infinity（数学上恒等差值 → 极限）
  var t=md/se, df=n-1;
  var p=isFinite(t)? tDist2tail(t, df) : 0;
  var cohen=sd>0? cohenD(d, null, "paired") : Infinity;
  var conf=0.95, crit=tCritical(df, conf);
  var margin=crit*se;
  return {kind:"paired", n:n, m1:mean(a.slice(0,n)), m2:mean(b.slice(0,n)),
          diff:md, sd:sd, se:se, t:t, df:df, p:p, cohensD:cohen,
          ciLower:md-margin, ciUpper:md+margin, conf:conf, crit:crit,
          d:d, x:a.slice(0,n), y:b.slice(0,n)};
}
function ttestOneSample(a, mu0){
  var n=a.length, ma=mean(a), sa=Math.sqrt(variance(a));
  var se=sa/Math.sqrt(n);
  var t=(ma-mu0)/se, df=n-1, p=tDist2tail(t, df);
  var conf=0.95, crit=tCritical(df, conf);
  var cohen=cohenD(a, mu0, "one");
  return {kind:"one", n:n, mean:ma, std:sa, mu0:mu0, se:se, t:t, df:df, p:p,
          cohensD:cohen, ciLower:ma-crit*se, ciUpper:ma+crit*se,
          conf:conf, crit:crit, x:a};
}
function variance(arr){  // 样本方差 ddof=1
  var n=arr.length, m=mean(arr);
  if(n<=1) return NaN;
  var s=0; for(var i=0;i<n;i++){var d=arr[i]-m; s+=d*d;}
  return s/(n-1);
}
function tCritical(df, conf){
  // 双侧 t 临界值 —— 在 [0, hi] 单调区间二分搜索
  if(df>100000) return Math.sqrt(2)*normInv(1-(1-conf)/2);  // 大 df → 正态近似
  var alpha = (1-conf)/2;
  var lo=0, hi=30;
  while(hi-lo>1e-5){
    var mid=(lo+hi)/2;
    if(tDist2tail(mid, df) < 2*alpha) hi=mid; else lo=mid;
  }
  return (lo+hi)/2;
}
function normInv(p){
  // 标准正态逆 CDF —— Beasley-Springer-Moro 近似
  if(p<=0) p=1e-12; if(p>=1) p=1-1e-12;
  var a=[-3.969683028665376e+01, 2.209460984245205e+02, -2.759285104469687e+02,
         1.383577518672690e+02, -3.066479806614716e+01, 2.506628277459239e+00];
  var b=[-5.447609879822406e+01, 1.615858368580409e+02, -1.556989798598866e+02,
         6.680131188771972e+01, -1.328068155288572e+01];
  var c=[-7.784894002430293e-03, -3.223964580411413e-01, -2.400758277161838e+00,
        -2.549732539343734e+00, 4.374664141464968e+00, 2.938163982698783e+00];
  var d=[7.784695709041462e-03, 3.224671290700398e-01, 2.445134137142996e+00, 3.754408661907416e+00];
  var pLow=0.02425, pHigh=1-pLow;
  var q,r;
  if(p<pLow){ q=Math.sqrt(-2*Math.log(p)); return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if(p<=pHigh){ q=p-0.5; r=q*q; return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1); }
  q=Math.sqrt(-2*Math.log(1-p));
  return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
}

/* =====================================================================
 * 6.5 追加分布函数：F 右尾 / 卡方右尾（不完全 Gamma 正则化）
 * ===================================================================== */
function gammaincP(a, x){
  // 正则化下不完全 gamma P(a,x)=γ(a,x)/Γ(a) —— 级数展开（x ≤ a+1 时用）
  if(x<=0||a<=0) return 0;
  var ap=a, sum=1/a, del=sum;
  for(var i=0;i<300;i++){ ap+=1; del*=x/ap; sum+=del; if(Math.abs(del)<Math.abs(sum)*1e-13) break; }
  return sum*Math.exp(-x+a*Math.log(x)-lGamma(a));
}
function gammaincQ(a, x){
  // 正则化上不完全 gamma Q(a,x)=Γ(a,x)/Γ(a) —— 连分式（x > a+1 时用）
  var b=x+1-a, c=1e300, d=1/b, h=d;
  for(var i=1;i<=300;i++){
    var an=-i*(i-a); b+=2;
    d=an*d+b; if(Math.abs(d)<1e-300) d=1e-300;
    c=b+an/c; if(Math.abs(c)<1e-300) c=1e-300;
    d=1/d; var del=d*c; h*=del;
    if(Math.abs(del-1)<1e-13) break;
  }

}
function gammaincReg(a, x){ return (x > a+1) ? 1-gammaincQ(a, x) : gammaincP(a, x); }
function chi2P(x, df){
  // 卡方分布右尾概率 = 1 − P(df/2, x/2)
  if(x<=0) return 1;
  if(df<=0) return NaN;
  return 1-gammaincReg(df/2, x/2);
}
function fDistP(f, df1, df2){
  // F 分布右尾概率 = I_{df2/(df2+df1·f)}(df2/2, df1/2)
  if(f<=0) return 1;
  if(!isFinite(f)) return 0;
  var x=df2/(df2+df1*f);
  return betaInc(df2/2, df1/2, x);
}

/* =====================================================================
 * 6.6 非参数检验（秩次方法）：并列取平均秩 + 四个检验
 * ===================================================================== */
function rankAll(values){
  // 升序赋秩，并列取平均秩；返回与 values 等长的秩数组
  var idx=values.map(function(_,i){return i;});
  idx.sort(function(a,b){ return values[a]-values[b]; });
  var ranks=new Array(values.length);
  for(var i=0;i<values.length;){
    var j=i;
    while(j+1<values.length && values[idx[j+1]]===values[idx[i]]) j++;
    var avg=(i+1+j+1)/2;
    for(var k=i;k<=j;k++) ranks[idx[k]]=avg;
    i=j+1;
  }
  return ranks;
}
function tieCorrection(values){
  // 并列秩校正项 Σ(t³−t)
  var cnt={}, tie=0;
  values.forEach(function(v){ cnt[v]=(cnt[v]||0)+1; });
  Object.keys(cnt).forEach(function(k){ var t=cnt[k]; if(t>1) tie+=t*t*t-t; });
  return tie;
}
function mannWhitneyU(a, b, opts){
  // 两独立样本 Mann-Whitney U，正态近似 p（含并列秩与连续性校正）
  opts=opts||{};
  var all=a.concat(b), R=rankAll(all);
  var Ra=0; for(var i=0;i<a.length;i++) Ra+=R[i];
  var n1=a.length, n2=b.length, N=n1+n2;
  var U1=n1*n2+n1*(n1+1)/2-Ra, U2=n1*n2-U1, U=Math.min(U1,U2);
  var tie=tieCorrection(all);
  var mu=n1*n2/2;
  var sigma=Math.sqrt(n1*n2*(N+1)/12*(1 - tie/(N*N*N-N)));
  if(sigma===0) sigma=1e-12;
  var raw=U1-mu, absRaw=Math.max(0, Math.abs(raw)-(opts.continuity===false?0:0.5));
  var z=(raw<0?-absRaw:absRaw)/sigma;
  var alt=opts.alternative||"two";
  var p=alt==="g1" ? normCdf(z) : (alt==="g2" ? 1-normCdf(z) : 2*(1-normCdf(Math.abs(z))));
  var r=z/Math.sqrt(N);
  return {U:U, U1:U1, U2:U2, n1:n1, n2:n2, Ra:Ra, z:z, p:p, r:r, alternative:alt};
}
function kruskalWallisH(groups){
  // groups: [{name, values:[]}]；H ~ χ²(k−1)，含并列秩校正；ε² = H/(N−1)
  var all=[]; groups.forEach(function(g){ all=all.concat(g.values); });
  var R=rankAll(all), k=groups.length, N=all.length;
  var H=0, off=0, rankSums=[];
  groups.forEach(function(g){
    var s=0; for(var i=0;i<g.values.length;i++) s+=R[off+i];
    off+=g.values.length; rankSums.push(s);
    H+=s*s/g.values.length;
  });
  H=12/(N*(N+1))*H - 3*(N+1);
  var tie=tieCorrection(all);
  if(tie>0) H=H/(1 - tie/(N*N*N-N));
  var df=k-1, p=chi2P(H, df), eps2=H/(N-1);
  return {H:H, df:df, p:p, k:k, N:N, eps2:eps2, rankSums:rankSums};
}
function wilcoxonSignedRank(a, b, opts){
  // 配对样本，零差值剔除，|d| 赋秩，W=min(W⁺,W⁻)，正态近似 p
  opts=opts||{};
  var diff=[], signs=[];
  for(var i=0;i<Math.min(a.length,b.length);i++){
    var d=a[i]-b[i];
    if(d!==0){ diff.push(Math.abs(d)); signs.push(d>0?1:-1); }
  }
  var n=diff.length;
  if(n<1) throw new Error("所有有效配对的差值均为 0，Wilcoxon 符号秩检验不适用");
  var R=rankAll(diff);
  var Wp=0, Wn=0;
  for(var j=0;j<n;j++){ if(signs[j]>0) Wp+=R[j]; else Wn+=R[j]; }
  var W=Math.min(Wp, Wn);
  var tie=tieCorrection(diff);
  var mu=n*(n+1)/4;
  var sigma=Math.sqrt(n*(n+1)*(2*n+1)/24 - tie/48);
  if(sigma===0) sigma=1e-12;
  var raw=Wp-mu, absRaw=Math.max(0, Math.abs(raw)-(opts.continuity===false?0:0.5));
  var z=(raw<0?-absRaw:absRaw)/sigma;
  var alt=opts.alternative||"two";
  var p=alt==="g1" ? 1-normCdf(z) : (alt==="g2" ? normCdf(z) : 2*(1-normCdf(Math.abs(z))));
  return {W:W, Wp:Wp, Wn:Wn, n:n, z:z, p:p, alternative:alt};
}
function friedmanTest(matrix){
  // matrix: n 行 × k 列；行内赋秩，χ²_F ~ χ²(k−1)；Kendall's W
  var n=matrix.length, k=matrix[0].length;
  var colRankSum=new Array(k).fill(0);
  for(var i=0;i<n;i++){
    var R=rankAll(matrix[i]);
    for(var j=0;j<k;j++) colRankSum[j]+=R[j];
  }
  var chi2=0;
  for(var j=0;j<k;j++) chi2+=colRankSum[j]*colRankSum[j];
  chi2=12/(n*k*(k+1))*chi2 - 3*n*(k+1);
  var df=k-1, p=chi2P(chi2, df), W=chi2/(n*(k-1));
  return {chi2:chi2, df:df, p:p, k:k, n:n, colRankSum:colRankSum, W:W};
}

/* =====================================================================
 * 6.7 方差分析（ANOVA）+ 卡方检验算法
 * ===================================================================== */
function anovaOneWay(groups){
  // groups: [{name, values:[]}]；返回方差分析表 + 效应量
  var k=groups.length, N=0, all=[];
  groups.forEach(function(g){ N+=g.values.length; all=all.concat(g.values); });
  if(k<2) throw new Error("方差分析至少需要 2 个有效组");
  var dfb=k-1, dfw=N-k;
  if(dfw<=0) throw new Error("组内自由度不足：每组只有 1 个观测时无法估计组内方差，请补充组内样本");
  var grand=mean(all), SSb=0, SSw=0;
  groups.forEach(function(g){
    var m=mean(g.values);
    SSb += g.values.length*(m-grand)*(m-grand);
    g.values.forEach(function(v){ SSw += (v-m)*(v-m); });
  });
  var SSt=SSb+SSw;
  var MSb=SSb/dfb, MSw=SSw/dfw;
  var F=MSw===0 ? (MSb===0 ? 0 : Infinity) : MSb/MSw;
  var p=F===Infinity ? 0 : fDistP(F, dfb, dfw);
  var eta2=SSt===0 ? 0 : SSb/SSt;
  var omegaDen=SSt+MSw, omega2=omegaDen===0 ? 0 : (SSb-(k-1)*MSw)/omegaDen;
  return {SSb:SSb,SSw:SSw,SSt:SSt,dfb:dfb,dfw:dfw,MSb:MSb,MSw:MSw,F:F,p:p,eta2:eta2,omega2:omega2,grand:grand,k:k,N:N};
}
function leveneTest(groups){
  var trans=groups.map(function(g){
    var md=describe(g.values).median;
    return {name:g.name, values:g.values.map(function(v){ return Math.abs(v-md); })};
  });
  var a=anovaOneWay(trans);
  return {W:a.F, df1:a.dfb, df2:a.dfw, p:a.p};
}
function posthocTest(groups, MSw, dfw, method, alpha){
  var k=groups.length, comps=[], i, j;
  var ncmp=k*(k-1)/2;
  for(i=0;i<k;i++){
    for(j=i+1;j<k;j++){
      var gi=groups[i], gj=groups[j];
      var diff=mean(gi.values)-mean(gj.values);
      var se=Math.sqrt(MSw*(1/gi.values.length + 1/gj.values.length));
      var t=Math.abs(diff)/se, pRaw=tDist2tail(t, dfw);
      var p = (method==="lsd") ? pRaw : Math.min(1, pRaw*ncmp);
      comps.push({g1:gi.name, g2:gj.name, diff:diff, se:se, t:t, p:p, sig:p<alpha});
    }
  }
  return comps;
}
function chi2Independence(obs, rKeys, cKeys){
  var rk, ck, rowSum={}, colSum={}, N=0;
  rKeys.forEach(function(x){ rowSum[x]=0; cKeys.forEach(function(y){ rowSum[x]+=obs[x][y]||0; }); });
  cKeys.forEach(function(y){ colSum[y]=0; rKeys.forEach(function(x){ colSum[y]+=obs[x][y]||0; }); });
  rKeys.forEach(function(x){ N+=rowSum[x]; });
  var exp={}, chi2=0, minE=Infinity, lowE=0, cells=0;
  rKeys.forEach(function(x){
    exp[x]={};
    cKeys.forEach(function(y){
      var e=rowSum[x]*colSum[y]/N, o=obs[x][y]||0;
      exp[x][y]=e; cells++;
      if(e<minE) minE=e; if(e<5) lowE++;
      chi2 += (o-e)*(o-e)/e;
    });
  });
  var df=(rKeys.length-1)*(cKeys.length-1);
  var p=chi2P(chi2, df);
  var V=Math.sqrt(chi2/(N*Math.min(rKeys.length-1, cKeys.length-1)));
  var resid={};
  rKeys.forEach(function(x){
    resid[x]={};
    cKeys.forEach(function(y){
      var e=exp[x][y], o=obs[x][y]||0;
      resid[x][y]=(o-e)/Math.sqrt(e);
    });
  });
  return {rowSum:rowSum, colSum:colSum, N:N, exp:exp, chi2:chi2, df:df, p:p, V:V, resid:resid, minE:minE, lowE:lowE, cells:cells};
}
function chi2GoodnessOfFit(cnt, keys, ratios){
  var N=0; keys.forEach(function(k){ N+=cnt[k]; });
  var k=keys.length, ratioArr;
  if(!ratios || String(ratios)==="等比例"){
    ratioArr=keys.map(function(){ return 1/k; });
  } else {
    var parts=String(ratios).trim().split(/[:：,，\s]+/).map(function(s){ return parseFloat(s); });
    var s=parts.reduce(function(a,b){return a+b;},0);
    if(parts.length!==k || parts.some(function(v){ return !isFinite(v)||v<0; }) || s<=0){
      throw new Error("理论比例需填写 "+k+" 个非负数字（如 1:2:1），或选择「等比例」");
    }
    ratioArr=parts.map(function(p){ return p/s; });
  }
  var chi2=0, exp={};
  keys.forEach(function(kk, i){
    var e=N*ratioArr[i], o=cnt[kk];
    exp[kk]=e; chi2 += (o-e)*(o-e)/e;
  });
  var df=k-1, p=chi2P(chi2, df);
  return {chi2:chi2, df:df, p:p, exp:exp, ratios:ratioArr};
}

/* =====================================================================
 * 7. 数据清洗诊断（缺失 / 文本数字 / 异常 IQR / 重复行 / 类型问题）
 * ===================================================================== */
function cleanDiagnose(ds){
  var issues=[], i, j;
  // ds: {headers, rows}
  var missByCol=[], textNumByCol=[];
  for(j=0;j<ds.headers.length;j++){
    var miss=0, tn=0;
    for(i=0;i<ds.rows.length;i++){
      var raw=ds.rows[i][j], v=parseNum(raw);
      if(v===null) miss++;
      else if(isNaN(v)) { /* 真文本 */ }
      else if(String(raw).match(/[,\s¥￥]/)) tn++;
    }
    missByCol.push(miss); textNumByCol.push(tn);
    if(miss>0) issues.push({type:"缺失", col:ds.headers[j], detail:miss+" 个缺失值（"+fmtPct(miss/ds.rows.length)+"）", act:"用该列均值/行业均值填充，或直接删除缺失行"});
    if(tn>0) issues.push({type:"文本数字", col:ds.headers[j], detail:tn+" 个单元格含千分位逗号/货币符号/空格（如 1,250.5）", act:"去除杂质后转为数值类型"});
  }
  // 数值列异常值（IQR）
  for(j=0;j<ds.headers.length;j++){
    if(!isNumCol(ds.rows,j)) continue;
    var vals=colValues(ds.rows,j), st=describe(vals);
    var lo=st.q1-1.5*st.iqr, hi=st.q3+1.5*st.iqr, outs=vals.filter(function(v){return v<lo||v>hi;});
    if(outs.length) issues.push({type:"异常值", col:ds.headers[j], detail:outs.length+" 个超出 IQR 界限 ["+fmtNum(lo,0)+", "+fmtNum(hi,0)+"]，如 "+outs.slice(0,3).map(function(v){return fmtNum(v,0);}).join("、")+"…", act:"核对原始记录，确认录入错误后剔除或修正"});
  }
  // 重复行
  var seen={}, dups=0;
  for(i=0;i<ds.rows.length;i++){ var key=ds.rows[i].join("\u0001"); if(seen[key]) dups++; else seen[key]=1; }
  if(dups>0) issues.push({type:"重复行", col:"—", detail:dups+" 行完全重复", act:"去重后仅保留一行"});
  // 脏名称（首尾空格）
  var dirtyNames=0;
  for(j=0;j<ds.headers.length;j++) for(i=0;i<ds.rows.length;i++) if(/^\s|\s$/.test(ds.rows[i][j])){ dirtyNames++; break; }
  if(dirtyNames>0) issues.push({type:"脏名称", col:"—", detail:dirtyNames+" 个字段首尾含多余空格", act:"trim() 去除首尾空格"});
  return {issues:issues, missByCol:missByCol, textNumByCol:textNumByCol, nRows:ds.rows.length};
}

/* =====================================================================
 * 8. 分类汇总 / 数据透视
 * ===================================================================== */
function groupSummary(rows, catIdx, valIdx){
  var g={}, order=[];
  for(var i=0;i<rows.length;i++){
    var key=rows[i][catIdx]||"(空)";
    if(!g[key]){ g[key]={key:key,vals:[]}; order.push(key); }
    var v=parseNum(rows[i][valIdx]);
    if(v!==null&&!isNaN(v)) g[key].vals.push(v);
  }
  return order.map(function(k){
    var vs=g[k].vals, s=describe(vs);
    return {key:k, count:vs.length, sum:s.sum, mean:s.mean, min:s.min, max:s.max};
  }).sort(function(a,b){return b.sum-a.sum;});
}
function pivotTable(rows, rowIdx, colIdx, valIdx){
  var rowKeys=[], colKeys=[], map={}, ri, ci, rk, ck, v;
  for(var i=0;i<rows.length;i++){
    rk=rows[i][rowIdx]||"(空)"; ck=rows[i][colIdx]||"(空)";
    if(rowKeys.indexOf(rk)<0) rowKeys.push(rk);
    if(colKeys.indexOf(ck)<0) colKeys.push(ck);
    v=parseNum(rows[i][valIdx]); if(v===null||isNaN(v)) v=0;
    map[rk] = map[rk]||{}; map[rk][ck]=(map[rk][ck]||0)+v;
  }
  return {rowKeys:rowKeys, colKeys:colKeys, map:map};
}

function escXML(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function niceTicks(min, max, want){
  want=want||5; if(min===max){ min-=1; max+=1; }
  var span=max-min, step=Math.pow(10, Math.floor(Math.log10(span/want)));
  var err=span/want/step;
  step*= err>=7.5?10 : err>=3.5?5 : err>=1.5?2 : 1;
  var start=Math.ceil(min/step)*step, ticks=[];
  for(var t=start; t<=max+1e-9; t+=step) ticks.push(t);
  if(ticks.length>10){ step*=2; ticks=[]; for(var t2=Math.ceil(min/step)*step; t2<=max+1e-9; t2+=step) ticks.push(t2); }
  return ticks;
}

    var x2=cx+r*Math.cos(Math.PI/180*(end-90)),   y2=cy+r*Math.sin(Math.PI/180*(end-90));
    var large=ang>180?1:0;
    var col=cols[i%cols.length];
    g+='<path d="M '+cx+' '+cy+' L '+x1+' '+y1+' A '+r+' '+r+' 0 '+large+' 1 '+x2+' '+y2+' Z" fill="'+col+'" stroke="white" stroke-width="2"/>';
    var mid=Math.PI/180*(start+end-180)/2, lx=cx+(r+26)*Math.cos(mid), ly=cy+(r+26)*Math.sin(mid);
    if(v/total>=0.055){
      g+='<text x="'+lx+'" y="'+(ly+4)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="'+C.text+'">'+escXML(String(labels[i]))+'</text>';
      g+='<text x="'+lx+'" y="'+(ly+19)+'" text-anchor="middle" font-size="10.5" fill="'+C.gray+'">'+fmtPct(v/total,1)+'</text>';
    }
  });
  g+='<text x="'+cx+'" y="'+(cy-6)+'" text-anchor="middle" font-size="24" font-weight="800" fill="'+C.brandD+'">'+fmtNum(total,0)+'</text>';
  g+='<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" font-size="12" fill="'+C.gray+'">合计</text>';
  // 图例（右侧）

    g+='<rect x="'+lx+'" y="'+(ly+i*26)+'" width="13" height="13" rx="3" fill="'+col+'"/>';
    g+='<text x="'+(lx+20)+'" y="'+(ly+i*26+11)+'" font-size="12.5" fill="'+C.text+'">'+escXML(String(labels[i]))+'</text>';
    g+='<text x="'+(lx+20)+'" y="'+(ly+i*26+24)+'" font-size="10.5" fill="'+C.gray+'">'+fmtNum(values[i],0)+' · '+fmtPct(pct,1)+'</text>';
  });
  return svgWrap(g, w, h, opts);
}

function svgHist(values, opts){
  opts=opts||{};
  var n=values.length, bins=opts.bins||Math.max(5,Math.min(10,Math.round(Math.sqrt(n))));
  var minV=Math.min.apply(null,values), maxV=Math.max.apply(null,values);
  if(minV===maxV){ minV-=1; maxV+=1; }
  var bw=(maxV-minV)/bins, counts=new Array(bins).fill(0), i;
  for(i=0;i<n;i++){ var b=Math.min(bins-1, Math.floor((values[i]-minV)/bw)); counts[b]++; }
  var labels=[], l;
  for(l=0;l<bins;l++) labels.push(fmtNum(minV+bw*l,1)+"~"+fmtNum(minV+bw*(l+1),1));
  return svgBar(labels, counts, {title:opts.title, subtitle:opts.subtitle});
}

function svgScatter(xs, ys, opts){

  xMin=xt[0]; xMax=xt[xt.length-1]; yMin=yt[0]; yMax=yt[yt.length-1];

function svgLineForecast(labels, ys, opts){

function finding(level, title, text){

function promptBlock(promptText, note){
  return '<div class="prompt-box"><div class="pb-label">'
    +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'
    +'推荐 Prompt · 学生可复制此提示词，课后用真实 AI 复现同款分析</div>'

    +'<button class="pb-copy" onclick="copyPrompt(this)">复制 Prompt</button></div>';
}
function copyPrompt(btn){
  var box=btn.closest(".prompt-box"), txt=box.querySelector(".pb-text").innerText;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ flashCopied(btn); }, function(){ fallbackCopy(txt, btn); });
  } else fallbackCopy(txt, btn);
}
function fallbackCopy(txt, btn){
  var ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand("copy"); flashCopied(btn); }catch(e){}
  document.body.removeChild(ta);
}
function flashCopied(btn){
  var old=btn.textContent; btn.textContent="已复制 ✓";
  setTimeout(function(){ btn.textContent=old; }, 1600);
}
function qaNote(text){

}

function colOptions(ds){
  return ds.headers.map(function(h,k){ return {name:h, idx:k, num:isNumCol(ds.rows,k)}; });
}
function selHtml(opts, sel, id){
  var html='<select id="'+id+'">';
  opts.forEach(function(o){
    html+='<option value="'+o.idx+'"'+(String(o.idx)===String(sel)?" selected":"")+'>'+escXML(o.name)+(o.num?"（数值）":"")+'</option>';
  });
  return html+'</select>';
}
function multiSelHtml(opts, sels, id, max){
  var html='<select id="'+id+'" multiple size="'+Math.min(max||4, opts.length)+'">';
  opts.forEach(function(o){
    html+='<option value="'+o.idx+'"'+(sels.indexOf(o.idx)>=0?" selected":"")+'>'+escXML(o.name)+'</option>';
  });
  return html+'</select>';
}
// 自定义 option 列表的 select（用于检验类型/置信度等固定选项）
function customSel(items, sel, id){
  var html='<select id="'+id+'">';
  items.forEach(function(it){
    html+='<option value="'+escXML(it.v)+'"'+(it.v===sel?" selected":"")+'>'+escXML(it.l)+'</option>';
  });
  return html+'</select>';
}

/* =====================================================================
 * 11.5 壳子渲染器 —— 能力已完成 UI 与逻辑设计、数值算法待接入时，
 *      展示「设计规格 + 当前数据体检」，规格确认后再填算法，避免返工。
 *      spec = { name, metrics[], formulas[], charts[], findings[],
 *               todos[], notes[], prompt }
 * ===================================================================== */
function specList(items){
  if(!items || !items.length) return '<div class="ws-empty">（无）</div>';
  var h='<ul class="spec-list">';
  items.forEach(function(it){
    h+='<li class="spec-item"><span class="spec-k">'+escXML(it.k)+'</span>'
      +'<span class="spec-v">'+escXML(it.v)+(it.note?'<small>'+escXML(it.note)+'</small>':'')+'</span></li>';
  });
  return h+'</ul>';
}
function todoList(items){
  if(!items || !items.length) return '<div class="ws-empty">算法已全部接入。</div>';
  var h='<ul class="todo-list">';
  items.forEach(function(t){
    h+='<li class="todo-item"><span class="todo-box"></span><span>'
      +'<b>'+escXML(t.fn)+'</b>　'+escXML(t.what)
      +(t.ref?'<small>参考：'+escXML(t.ref)+'</small>':'')+'</span></li>';
  });
  return h+'</ul>';
}
function preTable(headers, rows){
  var h='<div class="table-wrap"><table class="pre-tbl"><tr>';
  headers.forEach(function(t,i){ h+='<th'+(i?' class="num"':'')+'>'+escXML(t)+'</th>'; });
  h+='</tr>';
  rows.forEach(function(r){
    h+='<tr>';
    r.forEach(function(c,i){ h+='<td'+(i?' class="num"':'')+'>'+c+'</td>'; });
    h+='</tr>';
  });
  return h+'</table></div>';
}
function shellBlock(spec, preHtml){
  var h="";
  h+='<div class="shell-flag">'
    +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
    +'<div><b>'+escXML(spec.name)+'</b>：UI 与逻辑设计已完成，数值算法正在接入中。'
    +'下方为设计规格与当前数据的体检结果 —— 规格确认后再填算法，避免返工。</div></div>';
  h+=resBlock('① 数据体检（当前数据是否适配）', preHtml);
  h+=resBlock('② 将输出的关键指标', specList(spec.metrics));
  if(spec.formulas && spec.formulas.length) h+=resBlock('③ 将使用的公式（教材口径）', specList(spec.formulas));
  if(spec.charts && spec.charts.length) h+=resBlock('④ 将绘制的图表', specList(spec.charts));
  if(spec.findings && spec.findings.length) h+=resBlock('⑤ 将给出的分层解读', specList(spec.findings));
  h+=resBlock('⑥ 待接入的算法（'+(spec.todos?spec.todos.length:0)+' 项）', todoList(spec.todos));
  if(spec.notes && spec.notes.length) h+=resBlock('⑦ 设计约定与前提假设', specList(spec.notes));
  h+=resBlock('⑧ 推荐 Prompt 模板（课后用 AI 复现）', promptBlock(spec.prompt, "算法接入后，此处会替换为带真实统计量的 Prompt。"));
  return h;
}
/* 壳子 run 的统一返回：标记 __shell，附带数据体检信息 */
function shellResult(spec, pre){
  return { __shell:true, spec:spec, pre:pre };
}
/* 通用：按分组列把数值列拆成若干组（成对剔除空值） */
function groupBy(ds, valIdx, grpIdx){
  var mp={}, order=[];
  ds.rows.forEach(function(r){
    var gk=String(r[grpIdx]);
    var v=parseNum(r[valIdx]);
    if(v==null||isNaN(v)) return;
    if(mp[gk]==null){ mp[gk]=[]; order.push(gk); }
    mp[gk].push(v);
  });
  return {map:mp, order:order};
}
/* 通用：某列的唯一取值个数（水平数） */
function levelCount(ds, idx){
  var seen={}, n=0;
  ds.rows.forEach(function(r){
    var k=String(r[idx]);
    if(k===""||k==="null"||k==="undefined") return;
    if(!seen[k]){ seen[k]=1; n++; }
  });
  return n;
}

        finding("sug","清洗闭环", "清洗后务必重新做一次描述统计对比：均值、标准差在清洗前后的变化幅度，能说明脏数据的影响程度。"));

        "我有一份数据表（"+ds.headers.length+" 列，"+res.nRows+" 行），列名："+ds.headers.join("、")+"。\n请用 pandas 完成数据清洗诊断并输出报告：① 缺失值统计；② 文本型数字（如 \"1,250.5\"、\"¥3200\"）检测与转换；③ IQR 异常值检测；④ 完全重复行；⑤ 分类字段首尾空格。\n对每个问题给出处理代码与建议。",

  sampling: {
    name:"抽样估计", short:"均值区间 + 比例区间 + 样本量",
    desc:"对样本做总体均值的 95% 置信区间估计（大样本 z 法），并可对「数值 > 阈值」的比例做区间估计，给出所需样本量建议。",
    fit:"适合一列样本数值（如 100 户电费）+ 可选比例阈值",

    detect:function(ds){ return colOptions(ds).some(function(o){return o.num;}); },
    config:function(ds){
      var opts=colOptions(ds).filter(function(o){return o.num;});
      var first=opts.length? opts[0].idx : 0;
      return '<div class="cfg-row"><label>数值列</label>'+selHtml(opts, first, "cfg_col")+'</div>'
        +'<div class="cfg-row"><label>比例阈值（可空）</label><input type="number" id="cfg_thr" placeholder="如 80（>80 元的占比）" style="min-height:40px"></div>'
        +'<div class="hint">均值区间采用 z=1.96（95% 置信，大样本）；填了阈值则额外估计「该列大于阈值」的比例区间，并做 np≥5 检验。</div>';
    },
    run:function(ds, cfg){
      var idx=parseInt(cfg.col||0,10), col=ds.headers[idx], vals=colValues(ds.rows, idx);
      var mi=meanInterval(vals);
      var res={col:col, vals:vals, mi:mi, pi:null, thr:null};
      var thrTxt=cfg.thr;
      if(thrTxt!==undefined && thrTxt!==null && String(thrTxt).trim()!==""){
        var thr=parseFloat(thrTxt);
        if(!isNaN(thr)){
          res.thr=thr;
          res.pi=propInterval(vals.map(function(v){return v>thr;}));
        }

      return res;

    render:function(ds, cfg, res){

        metricCard("样本均值 x̄", fmtNum(mi.mean,2)) +
        metricCard("样本标准差 s", fmtNum(mi.std,2)) +
        metricCard("标准误 SE", fmtNum(mi.se,2)) +
        (mi.large? '<div class="finding f-fact"><span class="f-badge">判定</span><div class="f-body"><span class="f-title">大样本成立</span>　n='+mi.n+' ≥ 30，可用 z 分布（中心极限定理）做区间估计。</div></div>' : ''));
      h+=resBlock('② 总体均值 95% 置信区间',
        metricCard("区间下限", fmtNum(mi.lower,2), "", "hl") +
        metricCard("区间上限", fmtNum(mi.upper,2), "", "hl") +
        metricCard("允许误差 E", fmtNum(mi.margin,2)) +
        formulaCard("置信区间公式", "x̄ ± z·(s/√n)", "x̄="+fmtNum(mi.mean,2)+"，z=1.96，s="+fmtNum(mi.std,2)+"，n="+mi.n, "["+fmtNum(mi.lower,2)+", "+fmtNum(mi.upper,2)+"]") +
        '<div class="chart-box">'+svgHist(res.vals, {title:res.col+" 分布与置信区间", subtitle:"蓝色区间 = 总体均值的 95% 置信区间"})+'</div>');
      if(res.pi){
        var pi=res.pi;
        h+=resBlock('③ 「'+res.col+' > '+fmtNum(res.thr,0)+'」的比例估计',
          metricCard("样本比例 p̂", fmtPct(pi.p,1), "", "hl") +
          metricCard("比例下限", fmtPct(pi.lower,1)) +
          metricCard("比例上限", fmtPct(pi.upper,1)) +
          (pi.checkOK? '<div class="finding f-fact"><span class="f-badge">检验</span><div class="f-body">np̂='+fmtNum(pi.np,0)+' ≥ 5 且 n(1−p̂)='+fmtNum(pi.nq,0)+' ≥ 5，正态近似条件满足。</div></div>' :
            '<div class="warn-box">np̂='+fmtNum(pi.np,1)+' 或 n(1−p̂)='+fmtNum(pi.nq,1)+' 小于 5，正态近似不可靠，需增大样本量或改用精确法。</div>') +
          formulaCard("比例区间公式", "p̂ ± z·√(p̂(1−p̂)/n)", "p̂="+fmtPct(pi.p,1)+"，n="+pi.n, "["+fmtPct(pi.lower,1)+", "+fmtPct(pi.upper,1)+"]"));
      }
      h+=resBlock('④ 样本量建议（控制误差 E 时所需样本量）',
        metricCard("E=3 时 n", fmtNum(requiredSampleSize(mi.std,3),0)) +
        metricCard("E=5 时 n", fmtNum(requiredSampleSize(mi.std,5),0)) +
        metricCard("E=10 时 n", fmtNum(requiredSampleSize(mi.std,10),0)) +
        formulaCard("样本量公式", "n = (z·s/E)²", "z=1.96，s="+fmtNum(mi.std,2)+"，取整", ""));
      h+=resBlock('⑤ 分层解读',
        finding("fact","区间结论", "有 95% 的把握认为总体均值落在 ["+fmtNum(mi.lower,2)+", "+fmtNum(mi.upper,2)+"] 之间，区间宽度 "+fmtNum(mi.upper-mi.lower,2)+"。")+
        finding("anl","精度评价", "区间半宽（允许误差）为 "+fmtNum(mi.margin,2)+"，"+(mi.margin/mi.mean<0.1?"相对均值约 "+fmtPct(mi.margin/mi.mean,1)+"，估计精度较高。":"相对均值约 "+fmtPct(mi.margin/mi.mean,1)+"，若需更精确可增大样本量。"))+
        finding("anl","正确解读", "「95% 置信」指重复抽样 100 次约 95 次区间覆盖真值——不是「真值有 95% 概率落在区间内」，这是经典易错点。")+
        (res.pi? finding("sug","比例决策", "超过 "+fmtNum(res.thr,0)+" 的占比估计为 "+fmtPct(res.pi.p,1)+"，区间 ["+fmtPct(res.pi.lower,1)+", "+fmtPct(res.pi.upper,1)+"]，可作为业务达标判断依据。") : ""));
      h+=resBlock('⑥ 推荐 Prompt（课后用 AI 复现）', promptBlock(
        "我有一份样本数据（"+res.col+"，n="+mi.n+"）："+res.vals.slice(0,6).join(", ")+" …\n请用 Python（scipy.stats 或手写公式）计算：① 总体均值的 95% 置信区间（大样本 z=1.96）；② 若以阈值 "+ (res.thr!==null?res.thr:80) +" 划分，估计「大于阈值」的比例及其 95% 置信区间，并做 np≥5 检验；③ 若要控制误差在 5 以内，所需样本量。给出公式、代入过程与结论。",
        "工作台已给出标准答案（z=1.96、无偏标准差），学生可用它校验自己的 AI 输出。"));
      return h;
    }
  },

  index: {

    desc:"对多产品「产量 q0/q1、价格 p0/p1」数据计算个体指数、拉氏与帕氏综合指数、加权平均指数，并做产量×成本的因素分析（指数体系自洽）。",

      h+=resBlock('③ 因素分析（产量影响 × 价格影响 = 总变动）',

      h+=resBlock('⑤ 推荐 Prompt（课后用 AI 复现）', promptBlock(
        "我有多产品的产量与成本数据：q0（基期产量）、q1（报告期产量）、p0（基期单位成本）、p1（报告期单位成本）。\n请计算：① 各产品产量、成本的个体指数；② 拉氏产量指数、帕氏价格指数、总成本指数；③ 因素分析：产量变动与价格变动分别对总成本的影响额；④ 验证指数体系 K总 = Kq×Kp。\n给出公式、代入过程与结论。",
        "这是教材第 6 章核心——指数体系自洽（拉氏×帕氏=总指数）是 QA 必查项，工作台已保证。"));
      return h;
    }
  },

  regress: {
    name:"相关与回归", short:"x/y 两列 · 相关系数 + 回归方程 + 预测",
    desc:"计算皮尔逊相关系数与强度分级，拟合一元线性回归方程（最小二乘），给出 R² 与预测值，并附「相关≠因果」警示。",
    fit:"适合两列数值：x（自变量）与 y（因变量）",
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>',
    detect:function(ds){
      var nums=colOptions(ds).filter(function(o){return o.num;});
      return nums.length>=2;
    },
    config:function(ds){
      var nums=colOptions(ds).filter(function(o){return o.num;});
      return '<div class="cfg-row"><label>自变量 x</label>'+selHtml(nums, nums[0].idx, "cfg_x")+'</div>'
        +'<div class="cfg-row"><label>因变量 y</label>'+selHtml(nums, nums.length>1?nums[1].idx:nums[0].idx, "cfg_y")+'</div>'
        +'<div class="cfg-row"><label>预测点 x₀（可空）</label><input type="number" id="cfg_x0" placeholder="如 15（内插）" style="min-height:40px"></div>'
        +'<div class="hint">不填预测点时，默认用 x 的中位数做内插演示。注意：外推（x₀ 超出样本范围）可靠性下降。</div>';
    },
    run:function(ds, cfg){
      var xIdx=parseInt(cfg.x||0,10), yIdx=parseInt(cfg.y||0,10);
      var xs=colValues(ds.rows, xIdx), ys=colValues(ds.rows, yIdx);
      var lg=linreg(xs, ys);
      var x0 = cfg.x0!==undefined&&String(cfg.x0).trim()!==""? parseFloat(cfg.x0) : null;
      if(x0===null||isNaN(x0)) x0=lg.meanX;
      var xMin=Math.min.apply(null,xs), xMax=Math.max.apply(null,xs);
      return {xCol:ds.headers[xIdx], yCol:ds.headers[yIdx], xs:xs, ys:ys, lg:lg, x0:x0, inside:x0>=xMin&&x0<=xMax};
    },
    render:function(ds, cfg, res){
      var lg=res.lg, h="";
      h+=resBlock('① 相关系数',
        metricCard("r", fmtNum(lg.r,4), "", "hl") +
        metricCard("方向", lg.r>=0?"正相关":"负相关") +
        metricCard("强度", corrStrength(lg.r)) +
        metricCard("样本 n", fmtNum(lg.n,0)) +
        formulaCard("皮尔逊相关系数", "r = Σ(x−x̄)(y−ȳ) / √(Σ(x−x̄)²·Σ(y−ȳ)²)", "", fmtNum(lg.r,4)));
      h+=resBlock('② 回归方程（最小二乘）',
        '<div class="metric-grid">'+
        metricCard("截距 a", fmtNum(lg.a,3)) + metricCard("斜率 b", fmtNum(lg.b,3)) +
        metricCard("决定系数 R²", fmtNum(lg.r2,4), "", "hl") +
        metricCard("解释力度", fmtPct(lg.r2,1), "%") + '</div>'+
        formulaCard("回归方程", "ŷ = a + b·x", "a="+fmtNum(lg.a,3)+"，b="+fmtNum(lg.b,3), "ŷ = "+fmtNum(lg.a,3)+" + "+fmtNum(lg.b,3)+"x") +
        formulaCard("R² 含义", "R² = 回归平方和/总平方和", "表示 y 的变异中有 "+fmtPct(lg.r2,1)+" 可由 x 解释", ""));
      h+=resBlock('③ 预测（x₀='+fmtNum(res.x0,2)+'）',
        metricCard("预测值 ŷ", fmtNum(lg.predict(res.x0),2), "", "hl") +
        (res.inside? '<div class="finding f-fact"><span class="f-badge">内插</span><div class="f-body"><span class="f-title">x₀ 在样本范围内</span>　预测属于内插，可靠性较高。</div></div>'
          : '<div class="warn-box">x₀ 超出样本范围 ['+fmtNum(Math.min.apply(null,res.xs),1)+', '+fmtNum(Math.max.apply(null,res.xs),1)+']，属于外推，预测可靠性下降，请谨慎使用。</div>') +
        formulaCard("预测公式", "ŷ = a + b·x₀", "x₀="+fmtNum(res.x0,2), fmtNum(lg.predict(res.x0),2)) +
        '<div class="chart-box">'+svgScatter(res.xs, res.ys, {title:res.xCol+" × "+res.yCol+" 散点与回归线", subtitle:"橙色虚线 = 最小二乘回归线", a:lg.a, b:lg.b, r2:lg.r2, predictX:res.x0})+'</div>');
      h+=resBlock('④ 分层解读',
        finding("fact","相关结论", "r="+fmtNum(lg.r,4)+"，"+res.xCol+" 与 "+res.yCol+" 呈"+(lg.r>=0?"正":"负")+corrStrength(lg.r)+"（|r|="+fmtNum(Math.abs(lg.r),4)+"）。")+
        finding("anl","回归解释", "x 每增加 1 单位，y 平均"+(lg.b>=0?"增加":"减少")+" "+fmtNum(Math.abs(lg.b),3)+" 单位；R²="+fmtNum(lg.r2,4)+"，模型解释了 y 变异的 "+fmtPct(lg.r2,1)+"。")+
        finding("warn","相关 ≠ 因果", "即使相关性很强，也不能证明 x 导致 y——可能存在第三个变量（混杂因素）或反向因果。本工作台只报告相关与预测，不宣示因果。")+
        finding("sug","使用边界", "预测值只适合在样本范围内做内插使用；用于决策时请结合业务知识，并注意外推风险。"));
      h+=resBlock('⑤ 推荐 Prompt（课后用 AI 复现）', promptBlock(
        "我有两列数据：x（"+res.xCol+"）、y（"+res.yCol+"），共 "+lg.n+" 个样本。\n请用 Python（numpy/scipy 或 statsmodels）计算：① 皮尔逊相关系数并分级；② 一元线性回归的 a、b、R²；③ 预测 x₀="+fmtNum(res.x0,2)+" 时的 ŷ；④ 绘制散点图+回归线+预测点。\n最后用 100 字解释结果，并说明为什么「相关不等于因果」。\n数据示例："+res.xs.slice(0,5).map(function(v,i){return "("+v+","+res.ys[i]+")";}).join(" ")+" …",
        "工作台的 r/R²/预测即为标准答案；「相关≠因果」警示块是教材强调的要点，务必让学生记住。"));
      return h;
    }
  },

  ts: {
    name:"时间序列分析", short:"时间 + 数值 · 发展速度/趋势/预测",
    desc:"计算平均发展水平、平均增长量、环比/定基发展速度、几何平均发展速度，拟合线性趋势方程并外推预测下一期。",
    fit:"适合「时间（年/月）+ 数值」两列（如历年总产值）",
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',
    detect:function(ds){
      var c=colOptions(ds), nums=c.filter(function(o){return o.num;});
      return nums.length>=1 && c.length>=2;
    },
    config:function(ds){
      var c=colOptions(ds), nums=c.filter(function(o){return o.num;});
      var tIdx=-1, i;
      for(i=0;i<c.length;i++) if(!c[i].num){ tIdx=c[i].idx; break; }
      if(tIdx<0) tIdx=c[0].idx;
      return '<div class="cfg-row"><label>时间列</label>'+selHtml(c, tIdx, "cfg_t")+'</div>'
        +'<div class="cfg-row"><label>数值列</label>'+selHtml(c, nums.length?nums[0].idx:c[0].idx, "cfg_y")+'</div>'
        +'<div class="cfg-row"><label>预测期数</label><input type="number" id="cfg_fc" value="1" min="1" max="3" style="min-height:40px"></div>'
        +'<div class="hint">趋势方程以 t=0,1,2… 拟合 ŷ=a+bt；预测 = 外推 t 至最后一期之后。</div>';
    },
    run:function(ds, cfg){
      var tIdx=parseInt(cfg.t||0,10), yIdx=parseInt(cfg.y||0,10);
      var labels=ds.rows.map(function(r){return r[tIdx];});
      var ys=colValues(ds.rows, yIdx);
      var ta=tsAnalysis(ys);
      var fcN=Math.max(1, Math.min(3, parseInt(cfg.fc||1,10)));
      var fcs=[], i;
      for(i=0;i<fcN;i++) fcs.push(ta.trend.predict(ys.length-1+i+1));
      return {tCol:ds.headers[tIdx], yCol:ds.headers[yIdx], labels:labels, ys:ys, ta:ta, fcs:fcs};
    },
    render:function(ds, cfg, res){
      var ta=res.ta, h="", i;
      var n=res.ys.length;
      h+=resBlock('① 发展水平与增长量',
        metricCard("期数 n", fmtNum(n,0), "", "hl") +
        metricCard("初期水平", fmtNum(ta.first,2)) +
        metricCard("末期水平", fmtNum(ta.last,2)) +
        metricCard("平均发展水平", fmtNum(ta.avgLevel,2)) +
        metricCard("平均增长量", fmtSigned(ta.avgGrowth,2)) +
        formulaCard("平均发展水平（时期序列）", "ȳ = Σy / n", "Σy="+fmtNum(ta.avgLevel*n,2)+"，n="+n, fmtNum(ta.avgLevel,2)) +
        formulaCard("平均增长量", "Δ = (yₙ − y₁)/(n−1)", "("+fmtNum(ta.last,2)+" − "+fmtNum(ta.first,2)+")/"+(n-1), fmtSigned(ta.avgGrowth,2)));
      // 速度表
      var tr='<tr><th>期</th><th>水平</th><th>增长量</th><th>环比发展速度</th><th>环比增长速度</th><th>定基发展速度</th><th>定基增长速度</th></tr>';
      tr+='<tr><td>'+escXML(res.labels[0])+'</td><td>'+fmtNum(res.ys[0],2)+'</td><td>—</td><td>—</td><td>—</td><td>100.0%</td><td>—</td></tr>';
      for(i=1;i<n;i++){
        var chain=res.ys[i]/res.ys[i-1];
        tr+='<tr><td>'+escXML(res.labels[i])+'</td><td>'+fmtNum(res.ys[i],2)+'</td>'
          +'<td>'+fmtSigned(res.ys[i]-res.ys[i-1],2)+'</td>'
          +'<td>'+fmtNum(chain*100,1)+'%</td>'
          +'<td>'+fmtSigned((chain-1)*100,1)+'%</td>'
          +'<td>'+fmtNum(ta.fixed[i]*100,1)+'%</td>'
          +'<td>'+fmtSigned((ta.fixed[i]-1)*100,1)+'%</td></tr>';
      }
      h+=resBlock('② 发展速度表（环比 / 定基）', '<div class="table-wrap" style="overflow-x:auto"><table class="tbl" style="min-width:640px">'+tr+'</table></div>');
      h+=resBlock('③ 平均发展速度与趋势方程',
        metricCard("几何平均发展速度", fmtNum(ta.geoMean*100,1), "%", "hl") +
        metricCard("年均增长速度", fmtSigned((ta.geoMean-1)*100,1), "%") +
        metricCard("趋势方程斜率 b", fmtNum(ta.trend.b,3)) +
        formulaCard("几何平均发展速度", "x̄ = ⁿ⁻¹√(yₙ/y₁)", "ⁿ⁻¹√("+fmtNum(ta.last,2)+"/"+fmtNum(ta.first,2)+")", fmtNum(ta.geoMean*100,1)+"%") +
        formulaCard("趋势方程", "ŷ = a + b·t （t=0,1,2,…）", "a="+fmtNum(ta.trend.a,3)+"，b="+fmtNum(ta.trend.b,3), "ŷ = "+fmtNum(ta.trend.a,3)+" + "+fmtNum(ta.trend.b,3)+"t"));
      var fcN=res.fcs.length;
      h+=resBlock('④ 外推预测（未来 '+fcN+' 期）',
        res.fcs.map(function(f, k){
          return metricCard((k===0?"预测（下期）":"第 "+(k+1)+" 期"), fmtNum(f,2), "", "hl");
        }).join("") +
        '<div class="chart-box">'+svgLineForecast(res.labels, res.ys, {title:res.yCol+" 时序与趋势外推", subtitle:"蓝线=实际，橙虚线=趋势，红点=预测", trend:ta.trend, forecastVals:res.fcs, forecastN:fcN, forecastLabel:"预测下期"})+'</div>'
      );
      var fcFirst=res.fcs[0];
      h+=resBlock('⑤ 分层解读',
        finding("fact","总体走势", res.yCol+" 从 "+fmtNum(ta.first,2)+"（"+escXML(res.labels[0])+"）升至 "+fmtNum(ta.last,2)+"（"+escXML(res.labels[n-1])+"），"+n+" 期内累计"+(ta.last>=ta.first?"增长":"下降")+" "+fmtSigned(ta.last-ta.first,2)+"。")+
        finding("anl","平均速度", "几何平均发展速度 "+fmtNum(ta.geoMean*100,1)+"%，即年均"+(ta.geoMean>=1?"增长":"下降")+" "+fmtPct(Math.abs(ta.geoMean-1),1)+"。")+
        finding("anl","趋势强度", "趋势方程斜率 b="+fmtNum(ta.trend.b,3)+"，每期平均增加 "+fmtNum(ta.trend.b,2)+"；R²="+fmtNum(ta.trend.r2,3)+"，线性趋势"+(ta.trend.r2>=0.85?"拟合良好，适合短期外推预测。":"拟合一般，外推需谨慎。"))+
        finding("warn","外推预警", "预测基于线性趋势外推：未来 "+fcN+" 期预测值 "+fmtNum(fcFirst,2)+" 只是趋势延续的假设值，不反映周期/政策/突发事件影响，仅适合短期参考。")+
        finding("sug","使用建议", "把预测值与下期实际值对比，持续更新趋势方程；若出现拐点，应重新拟合或改用曲线模型。"));
      h+=resBlock('⑥ 推荐 Prompt（课后用 AI 复现）', promptBlock(
        "我有时间序列数据（"+res.yCol+"，"+n+" 期）："+res.labels.slice(0,6).map(function(l,i){return l+"="+fmtNum(res.ys[i],1);}).join("，")+" …\n请用 Python 计算：① 平均发展水平与平均增长量；② 环比/定基发展速度与增长速度表；③ 几何平均发展速度；④ 用最小二乘法拟合线性趋势方程并预测下一期。\n给出公式、代入过程与结论，并提示外推风险。",
        "工作台的速度表/趋势方程/预测即标准答案；外推预警是教材强调的方法边界。"));
      return h;
    }
  },

  group: {
    name:"分类汇总与透视", short:"类别 + 数值 +（分组）· 汇总/柱饼/透视",
    desc:"按类别列分类汇总（合计/均值/最值并排序），可选第二个分组列生成数据透视表（行×列交叉汇总），配合柱状图与占比饼图。",
    fit:"适合「类别+数值」或「类别A+类别B+数值」结构（如办事处×年份×销售额）",
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="3" x2="9" y2="21"/></svg>',
    detect:function(ds){ var c=colOptions(ds), nums=c.filter(function(o){return o.num;}); return nums.length>=1 && c.length>=2; },
    config:function(ds){
      var c=colOptions(ds), cats=c.filter(function(o){return !o.num;}), nums=c.filter(function(o){return o.num;});
      var catIdx=cats.length? cats[0].idx : c[0].idx;
      var grpIdx=cats.length>1? cats[1].idx : c[0].idx;
      return '<div class="cfg-row"><label>类别列</label>'+selHtml(c, catIdx, "cfg_cat")+'</div>'
        +'<div class="cfg-row"><label>数值列</label>'+selHtml(c, nums.length?nums[0].idx:c[0].idx, "cfg_val")+'</div>'
        +'<div class="cfg-row"><label>分组列（透视用，可空）</label>'+selHtml(c, grpIdx, "cfg_grp")+'</div>'
        +'<div class="hint">类别列做汇总排序；选「分组列」则额外生成行×列数据透视表（交叉求和）。</div>';
    },
    run:function(ds, cfg){
      var catIdx=parseInt(cfg.cat||0,10), valIdx=parseInt(cfg.val||1,10);
      var grpTxt=cfg.grp;
      var grpIdx = (grpTxt!==undefined&&grpTxt!==null&&String(grpTxt).trim()!=="")? parseInt(grpTxt,10) : -1;
      var gs=groupSummary(ds.rows, catIdx, valIdx);
      var pv = grpIdx>=0 ? pivotTable(ds.rows, catIdx, grpIdx, valIdx) : null;
      return {catCol:ds.headers[catIdx], valCol:ds.headers[valIdx],
        grpCol: grpIdx>=0? ds.headers[grpIdx] : null, gs:gs, pv:pv};
    },
    render:function(ds, cfg, res){
      var h="";
      var totalSum=sum(res.gs.map(function(g){return g.sum;}));
      var tr='<tr><th>'+escXML(res.catCol)+'</th><th>合计</th><th>均值</th><th>最小</th><th>最大</th><th>笔数</th><th>占比</th></tr>';
      res.gs.forEach(function(g){
        tr+='<tr><td><b>'+escXML(g.key)+'</b></td><td>'+fmtNum(g.sum,1)+'</td><td>'+fmtNum(g.mean,1)+'</td><td>'+fmtNum(g.min,1)+'</td><td>'+fmtNum(g.max,1)+'</td><td>'+g.count+'</td><td>'+fmtPct(totalSum?g.sum/totalSum:0,1)+'</td></tr>';
      });
      h+=resBlock('① 分类汇总表（按合计降序）', '<div class="table-wrap"><table class="tbl">'+tr+'</table></div>');
      h+=resBlock('② 汇总可视化',
        '<div class="chart-box">'+svgBar(res.gs.map(function(g){return g.key;}), res.gs.map(function(g){return g.sum;}), {title:res.catCol+" 合计对比柱状图", subtitle:"按 "+res.valCol+" 汇总"})+'</div>'+
        '<div class="chart-box">'+svgPie(res.gs.map(function(g){return g.key;}), res.gs.map(function(g){return g.sum;}), {title:res.catCol+" 占比饼图"})+'</div>');
      if(res.pv){
        var pt='<tr><th>'+escXML(res.catCol)+' \ '+escXML(res.grpCol)+'</th>';
        res.pv.colKeys.forEach(function(ck){ pt+='<th>'+escXML(ck)+'</th>'; });
        pt+='<th>合计</th></tr>';
        res.pv.rowKeys.forEach(function(rk){
          pt+='<tr><td><b>'+escXML(rk)+'</b></td>';
          var rowSum=0;
          res.pv.colKeys.forEach(function(ck){ var v=(res.pv.map[rk]||{})[ck]||0; rowSum+=v; pt+='<td>'+fmtNum(v,1)+'</td>'; });
          pt+='<td><b>'+fmtNum(rowSum,1)+'</b></td></tr>';
        });
        pt+='<tr><td><b>合计</b></td>';
        res.pv.colKeys.forEach(function(ck){ var s=0; res.pv.rowKeys.forEach(function(rk){ s+=(res.pv.map[rk]||{})[ck]||0; }); pt+='<td><b>'+fmtNum(s,1)+'</b></td>'; });
        pt+='<td><b>'+fmtNum(totalSum,1)+'</b></td></tr>';
        h+=resBlock('③ 数据透视表（'+escXML(res.catCol)+' × '+escXML(res.grpCol)+'，值='+escXML(res.valCol)+' 求和）',
          '<div class="table-wrap" style="overflow-x:auto"><table class="tbl" style="min-width:480px">'+pt+'</table></div>'+
          '<div class="finding f-fact"><span class="f-badge">透视</span><div class="f-body"><span class="f-title">交叉汇总</span>　行='+escXML(res.catCol)+'，列='+escXML(res.grpCol)+'，单元格=该组合的 '+escXML(res.valCol)+' 合计。透视表是 Excel 数据透视表的等价实现。</div></div>');
      }
      var top=res.gs[0];
      var top3=(function(){ var s=0; res.gs.slice(0,3).forEach(function(g){ s+=g.sum; }); return fmtPct(totalSum?s/totalSum:0,1); })();
      h+=resBlock('④ 分层解读',
        finding("fact","头部集中", top.key+" 合计 "+fmtNum(top.sum,1)+"，占总量的 "+fmtPct(totalSum?top.sum/totalSum:0,1)+"，是最大贡献类别。")+
        finding("anl","结构分布", "前 3 大类别合计占比 "+top3+"，"+(res.gs.length>3?"集中度较高，资源应聚焦头部。":"分布较均匀，风险分散但缺乏规模效应。"))+
        (res.pv? finding("anl","交叉发现", "透视表观察 "+res.catCol+" 与 "+res.grpCol+" 的联合结构：若某格显著偏高，说明该组合存在协同或季节因素；若各列比例稳定，则两维度近似独立。") : "")+
        finding("sug","使用建议", "汇总排序回答「谁大谁小」，占比饼图回答「结构如何」，透视表回答「两个维度如何交叉」——三层递进是描述性分析的完整路径。"));
      h+=resBlock('⑤ 推荐 Prompt（课后用 AI 复现）', promptBlock(
        "我有一份数据表（"+res.catCol+"、"+res.valCol+(res.pv?("、"+res.grpCol):"")+"），共 "+ds.rows.length+" 行。\n请用 pandas：① 按 "+res.catCol+" 分组对 "+res.valCol+" 做分类汇总（合计/均值/最值/笔数）并按合计降序；② 绘制柱状图与占比饼图；③ "+(res.pv?("生成数据透视表（行="+res.catCol+"，列="+res.grpCol+"，值="+res.valCol+" 求和）"):"若还有一列类别则生成数据透视表")+"；④ 用 100 字总结结构特征。",
        "工作台的汇总表/柱饼图/透视表即标准答案；透视表对应教材第 9 章可视化的数据组织。"));
      return h;
    }
  },

  ttest: {
      name:"t 检验（均值差异推断）", short:"独立/配对/单样本 · 均值差异",
      desc:"比较一组、两组独立样本或配对样本的均值是否有显著差异。三种类型：① 独立两样本（Welch/Student 可选）；② 配对样本（前后对比）；③ 单样本（与理论值比较）。教材口径：双尾 p 值、置信区间、Cohen's d 效应量。",

          +'</div>'

          +'</div>'
