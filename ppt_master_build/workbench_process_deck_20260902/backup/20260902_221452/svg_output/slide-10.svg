<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="ending" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#F7F6F2" stroke="none" stroke-width="1" rx="0" /><text x="64" y="44" font-size="14px" font-weight="700" fill="#1F6EA8" text-anchor="start">CLOSING</text><text x="1180" y="44" font-size="14px" font-weight="700" fill="#6E7476" text-anchor="end">10</text><line x1="64" y1="62" x2="1216" y2="62" stroke="#D4D7D8" stroke-width="1" /><text x="64" y="122" font-size="54px" font-weight="800" fill="#171717" text-anchor="start">最后，我把 AI 组织成了一条制作流程</text><text x="70" y="196" font-size="32px" font-weight="800" fill="#171717" text-anchor="start">先理解问题，再选择能力。</text><text x="70" y="248" font-size="32px" font-weight="800" fill="#171717" text-anchor="start">先设计结构，再实现功能。</text><text x="70" y="300" font-size="32px" font-weight="800" fill="#171717" text-anchor="start">最后用结果验证工具。</text><line x1="70" y1="370" x2="1210" y2="370" stroke="#D4D7D8" stroke-width="1" /><text x="70" y="438" font-size="18px" font-weight="800" fill="#1F6EA8" text-anchor="start">制作</text><text x="70" y="480" font-size="25px" font-weight="700" fill="#171717" text-anchor="start">读材料 → 定需求 → 选专家和技能 → 设计 → 实现 → 检查</text><text x="70" y="548" font-size="18px" font-weight="800" fill="#5C7A72" text-anchor="start">使用</text><text x="70" y="590" font-size="25px" font-weight="700" fill="#171717" text-anchor="start">放入数据 → 选择分析 → 查看并导出结果</text><rect x="70" y="650" width="1140" height="30" fill="#C76D3A" stroke="none" stroke-width="0" rx="4" /><text x="640" y="672" font-size="22px" font-weight="800" fill="#FFFFFF" text-anchor="middle">这就是我做数据分析工作台的基本逻辑。</text></svg>
