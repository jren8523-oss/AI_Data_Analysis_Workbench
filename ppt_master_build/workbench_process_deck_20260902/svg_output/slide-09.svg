<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#F7F6F2" stroke="none" stroke-width="1" rx="0" /><text x="64" y="44" font-size="14px" font-weight="700" fill="#1F6EA8" text-anchor="start">PART 2 / 功能</text><text x="1180" y="44" font-size="14px" font-weight="700" fill="#6E7476" text-anchor="end">09</text><line x1="64" y1="62" x2="1216" y2="62" stroke="#D4D7D8" stroke-width="1" /><text x="64" y="122" font-size="54px" font-weight="800" fill="#171717" text-anchor="start">三种数据入口，一个交付出口</text><rect x="64" y="160" width="250" height="198" fill="#FFFFFF" stroke="#D4D7D8" stroke-width="1" rx="10" /><image id="upload-data" href="../images/upload-data.png" x="78" y="174" width="222" height="168" preserveAspectRatio="xMidYMid meet" /><text x="189" y="390" font-size="22px" font-weight="800" fill="#171717" text-anchor="middle">上传数据</text><text x="189" y="420" font-size="18px" font-weight="400" fill="#6E7476" text-anchor="middle">拖入 CSV</text><rect x="332" y="160" width="250" height="198" fill="#FFFFFF" stroke="#D4D7D8" stroke-width="1" rx="10" /><image id="public-datasets" href="../images/public-datasets.png" x="346" y="174" width="222" height="168" preserveAspectRatio="xMidYMid meet" /><text x="457" y="390" font-size="22px" font-weight="800" fill="#171717" text-anchor="middle">公开数据库</text><text x="457" y="420" font-size="18px" font-weight="400" fill="#6E7476" text-anchor="middle">直接跳转数据源</text><rect x="600" y="160" width="250" height="198" fill="#FFFFFF" stroke="#D4D7D8" stroke-width="1" rx="10" /><image id="bazhuayu" href="../images/bazhuayu-guide.png" x="614" y="174" width="222" height="168" preserveAspectRatio="xMidYMid meet" /><text x="725" y="390" font-size="22px" font-weight="800" fill="#171717" text-anchor="middle">八爪鱼采集</text><text x="725" y="420" font-size="18px" font-weight="400" fill="#6E7476" text-anchor="middle">采集后导出 CSV</text><rect x="900" y="160" width="300" height="408" fill="#EEF1F2" stroke="none" stroke-width="0" rx="10" /><text x="936" y="222" font-size="18px" font-weight="800" fill="#C76D3A" text-anchor="start">最后的交付</text><text x="936" y="276" font-size="48px" font-weight="800" fill="#171717" text-anchor="start">HTML</text><text x="936" y="334" font-size="24px" font-weight="400" fill="#171717" text-anchor="start"><tspan x="936" dy="0">根据需要选择交付形式。</tspan><tspan x="936" dy="38">分析结果可以直接查看，</tspan><tspan x="936" dy="38">也可以导出成 HTML。</tspan></text><line x1="936" y1="466" x2="1162" y2="466" stroke="#D4D7D8" stroke-width="1" /><text x="936" y="516" font-size="22px" font-weight="800" fill="#1F6EA8" text-anchor="start">入口可以不同</text><text x="936" y="552" font-size="22px" font-weight="800" fill="#5C7A72" text-anchor="start">分析流程保持一致</text></svg>
