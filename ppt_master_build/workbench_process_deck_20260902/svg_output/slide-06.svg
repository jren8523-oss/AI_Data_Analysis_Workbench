<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#F7F6F2" stroke="none" stroke-width="1" rx="0" /><text x="64" y="44" font-size="14px" font-weight="700" fill="#1F6EA8" text-anchor="start">05 / 实现</text><text x="1180" y="44" font-size="14px" font-weight="700" fill="#6E7476" text-anchor="end">06</text><line x1="64" y1="62" x2="1216" y2="62" stroke="#D4D7D8" stroke-width="1" /><text x="64" y="122" font-size="54px" font-weight="800" fill="#171717" text-anchor="start">先搭骨架，再填功能</text><text x="70" y="184" font-size="30px" font-weight="700" fill="#171717" text-anchor="start">有了界面参考以后，我把制作拆成三件事。</text><line x1="112" y1="300" x2="112" y2="572" stroke="#1F6EA8" stroke-width="4" /><circle cx="112" cy="316" r="18" fill="#1F6EA8" stroke="none" stroke-width="1" /><text x="156" y="326" font-size="26px" font-weight="800" fill="#171717" text-anchor="start">规划功能</text><text x="156" y="360" font-size="22px" font-weight="400" fill="#6E7476" text-anchor="start">写说明文档，或边讨论边确定功能范围。</text><circle cx="112" cy="418" r="18" fill="#5C7A72" stroke="none" stroke-width="1" /><text x="156" y="428" font-size="26px" font-weight="800" fill="#171717" text-anchor="start">搭好 UI</text><text x="156" y="462" font-size="22px" font-weight="400" fill="#6E7476" text-anchor="start">在 Codex 里持续微调界面结构。</text><circle cx="112" cy="520" r="18" fill="#C76D3A" stroke="none" stroke-width="1" /><text x="156" y="530" font-size="26px" font-weight="800" fill="#171717" text-anchor="start">填入功能</text><text x="156" y="564" font-size="22px" font-weight="400" fill="#6E7476" text-anchor="start">让 AI 补上数据处理和交付逻辑。</text><rect x="760" y="264" width="430" height="300" fill="#EEF1F2" stroke="none" stroke-width="0" rx="12" /><text x="800" y="320" font-size="28px" font-weight="800" fill="#1F6EA8" text-anchor="start">最后再做质量检查</text><text x="800" y="380" font-size="24px" font-weight="700" fill="#171717" text-anchor="start"><tspan x="800" dy="0">karpathy</tspan><tspan x="800" dy="42">检查代码是否简单、可靠</tspan><tspan x="800" dy="42">superpower</tspan><tspan x="800" dy="42">检查功能是否完整、可用</tspan></text><line x1="800" y1="528" x2="1120" y2="528" stroke="#D4D7D8" stroke-width="1" /><text x="800" y="560" font-size="22px" font-weight="400" fill="#6E7476" text-anchor="start">先骨架，后细节，再验收</text></svg>
