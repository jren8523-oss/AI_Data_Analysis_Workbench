<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#F7F6F2" stroke="none" stroke-width="1" rx="0" /><text x="64" y="44" font-size="14px" font-weight="700" fill="#1F6EA8" text-anchor="start">02 / 配置</text><text x="1180" y="44" font-size="14px" font-weight="700" fill="#6E7476" text-anchor="end">03</text><line x1="64" y1="62" x2="1216" y2="62" stroke="#D4D7D8" stroke-width="1" /><text x="64" y="122" font-size="54px" font-weight="800" fill="#171717" text-anchor="start">给 AI 配上合适的角色和能力</text><text x="70" y="188" font-size="28px" font-weight="700" fill="#171717" text-anchor="start"><tspan x="70" dy="0">WorkBuddy 里有很多专家和技能。</tspan><tspan x="70" dy="42">我选择“工作台搭建师”，再按需要挂载 Skill。</tspan></text><rect x="70" y="312" width="504" height="292" fill="#EEF1F2" stroke="none" stroke-width="0" rx="12" /><text x="96" y="356" font-size="20px" font-weight="800" fill="#1F6EA8" text-anchor="start">Expert</text><text x="96" y="396" font-size="36px" font-weight="800" fill="#171717" text-anchor="start">决定 AI 怎么想</text><text x="96" y="448" font-size="22px" font-weight="400" fill="#6E7476" text-anchor="start"><tspan x="96" dy="0">工作台搭建师</tspan><tspan x="96" dy="34">负责从产品角度拆解需求、规划结构。</tspan></text><rect x="610" y="312" width="600" height="292" fill="#FFFFFF" stroke="#D4D7D8" stroke-width="1" rx="12" /><image id="workbuddy-experts" href="../images/workbuddy-experts-skills.png" x="626" y="328" width="568" height="260" preserveAspectRatio="xMidYMid meet" /><rect x="626" y="548" width="150" height="30" fill="#1F6EA8" stroke="none" stroke-width="0" rx="15" /><text x="701" y="569" font-size="16px" font-weight="700" fill="#FFFFFF" text-anchor="middle">工作台搭建师</text><text x="804" y="568" font-size="18px" font-weight="400" fill="#6E7476" text-anchor="start">选择合适的协作角色</text></svg>
