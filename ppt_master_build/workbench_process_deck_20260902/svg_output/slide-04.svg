<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#F7F6F2" stroke="none" stroke-width="1" rx="0" /><text x="64" y="44" font-size="14px" font-weight="700" fill="#1F6EA8" text-anchor="start">03 / 对齐</text><text x="1180" y="44" font-size="14px" font-weight="700" fill="#6E7476" text-anchor="end">04</text><line x1="64" y1="62" x2="1216" y2="62" stroke="#D4D7D8" stroke-width="1" /><text x="64" y="122" font-size="54px" font-weight="800" fill="#171717" text-anchor="start">先把需求问清楚</text><text x="70" y="184" font-size="34px" font-weight="800" fill="#171717" text-anchor="start">工具：grill-me</text><text x="70" y="226" font-size="24px" font-weight="400" fill="#6E7476" text-anchor="start">它会通过多轮提问，把“大概想法”问成可以开始设计的方案。</text><rect x="70" y="282" width="1140" height="144" fill="#FFFFFF" stroke="#D4D7D8" stroke-width="1" rx="10" /><image id="grill-me" href="../images/grill-me-guide.png" x="92" y="302" width="1096" height="102" preserveAspectRatio="xMidYMid meet" /><line x1="70" y1="486" x2="1210" y2="486" stroke="#D4D7D8" stroke-width="1" /><circle cx="116" cy="558" r="30" fill="#1F6EA8" stroke="none" stroke-width="1" /><text x="116" y="566" font-size="20px" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="170" y="566" font-size="24px" font-weight="700" fill="#171717" text-anchor="start">提出大致想法</text><circle cx="496" cy="558" r="30" fill="#5C7A72" stroke="none" stroke-width="1" /><text x="496" y="566" font-size="20px" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="550" y="566" font-size="24px" font-weight="700" fill="#171717" text-anchor="start">多轮追问</text><circle cx="832" cy="558" r="30" fill="#C76D3A" stroke="none" stroke-width="1" /><text x="832" y="566" font-size="20px" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="886" y="566" font-size="24px" font-weight="700" fill="#171717" text-anchor="start">形成清晰构思</text><text x="1210" y="680" font-size="16px" font-weight="400" fill="#6E7476" text-anchor="end">需求越具体，后面越少返工</text></svg>
