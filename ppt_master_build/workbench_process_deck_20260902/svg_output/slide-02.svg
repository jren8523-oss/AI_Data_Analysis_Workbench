<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#F7F6F2" stroke="none" stroke-width="1" rx="0" /><text x="64" y="44" font-size="14px" font-weight="700" fill="#1F6EA8" text-anchor="start">01 / 起点</text><text x="1180" y="44" font-size="14px" font-weight="700" fill="#6E7476" text-anchor="end">02</text><line x1="64" y1="62" x2="1216" y2="62" stroke="#D4D7D8" stroke-width="1" /><text x="64" y="122" font-size="54px" font-weight="800" fill="#171717" text-anchor="start">先让 AI 读懂课程材料</text><text x="70" y="186" font-size="30px" font-weight="700" fill="#171717" text-anchor="start">我先把老师上课用的 10 个课程 PPT 交给 AI。</text><text x="70" y="232" font-size="24px" font-weight="400" fill="#6E7476" text-anchor="start">先理解课程内容，再决定要做什么工具。</text><line x1="70" y1="300" x2="1150" y2="300" stroke="#D4D7D8" stroke-width="2" /><circle cx="118" cy="410" r="36" fill="#1F6EA8" stroke="none" stroke-width="1" /><text x="118" y="420" font-size="20px" font-weight="800" fill="#FFFFFF" text-anchor="middle">01</text><text x="180" y="390" font-size="18px" font-weight="700" fill="#6E7476" text-anchor="start">输入</text><text x="180" y="424" font-size="32px" font-weight="700" fill="#171717" text-anchor="start">10 个课程 PPT</text><line x1="380" y1="410" x2="490" y2="410" stroke="#1F6EA8" stroke-width="2" /><circle cx="540" cy="410" r="36" fill="#5C7A72" stroke="none" stroke-width="1" /><text x="540" y="420" font-size="20px" font-weight="800" fill="#FFFFFF" text-anchor="middle">02</text><text x="602" y="390" font-size="18px" font-weight="700" fill="#6E7476" text-anchor="start">理解</text><text x="602" y="424" font-size="32px" font-weight="700" fill="#171717" text-anchor="start">让 AI 总结课程任务</text><line x1="830" y1="410" x2="940" y2="410" stroke="#1F6EA8" stroke-width="2" /><circle cx="990" cy="410" r="36" fill="#C76D3A" stroke="none" stroke-width="1" /><text x="990" y="420" font-size="20px" font-weight="800" fill="#FFFFFF" text-anchor="middle">03</text><text x="1052" y="390" font-size="18px" font-weight="700" fill="#6E7476" text-anchor="start">需求</text><text x="1052" y="424" font-size="32px" font-weight="700" fill="#171717" text-anchor="start">做一个工作台</text><rect x="70" y="550" width="1140" height="74" fill="#EEF1F2" stroke="none" stroke-width="0" rx="8" /><text x="96" y="598" font-size="30px" font-weight="800" fill="#171717" text-anchor="start">课程材料  →  AI 理解  →  清晰需求</text><text x="1210" y="682" font-size="16px" font-weight="400" fill="#6E7476" text-anchor="end">先把问题说清楚，再开始制作</text></svg>
