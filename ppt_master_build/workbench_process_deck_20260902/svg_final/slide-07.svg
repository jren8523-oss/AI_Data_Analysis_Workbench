<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#F7F6F2" stroke="none" stroke-width="1" rx="0" /><text x="64" y="44" font-size="14px" font-weight="700" fill="#1F6EA8" text-anchor="start">RECAP</text><text x="1180" y="44" font-size="14px" font-weight="700" fill="#6E7476" text-anchor="end">07</text><line x1="64" y1="62" x2="1216" y2="62" stroke="#D4D7D8" stroke-width="1" /><text x="64" y="122" font-size="54px" font-weight="800" fill="#171717" text-anchor="start">我的做法：把一次任务做成可复用工具</text><text x="70" y="194" font-size="32px" font-weight="800" fill="#171717" text-anchor="start">不是让 AI 一键生成，而是让 AI 在每一步承担具体工作。</text><line x1="70" y1="246" x2="1210" y2="246" stroke="#D4D7D8" stroke-width="1" /><text x="76" y="318" font-size="18px" font-weight="800" fill="#1F6EA8" text-anchor="start">01</text><text x="142" y="318" font-size="26px" font-weight="700" fill="#171717" text-anchor="start">读材料</text><text x="360" y="318" font-size="21px" font-weight="400" fill="#6E7476" text-anchor="start">建立课程背景</text><text x="76" y="368" font-size="18px" font-weight="800" fill="#1F6EA8" text-anchor="start">02</text><text x="142" y="368" font-size="26px" font-weight="700" fill="#171717" text-anchor="start">定角色</text><text x="360" y="368" font-size="21px" font-weight="400" fill="#6E7476" text-anchor="start">选择 Expert + Skill</text><text x="76" y="418" font-size="18px" font-weight="800" fill="#1F6EA8" text-anchor="start">03</text><text x="142" y="418" font-size="26px" font-weight="700" fill="#171717" text-anchor="start">做对齐</text><text x="360" y="418" font-size="21px" font-weight="400" fill="#6E7476" text-anchor="start">把想法问具体</text><text x="76" y="468" font-size="18px" font-weight="800" fill="#1F6EA8" text-anchor="start">04</text><text x="142" y="468" font-size="26px" font-weight="700" fill="#171717" text-anchor="start">画界面</text><text x="360" y="468" font-size="21px" font-weight="400" fill="#6E7476" text-anchor="start">先看结构和审美</text><text x="76" y="518" font-size="18px" font-weight="800" fill="#1F6EA8" text-anchor="start">05</text><text x="142" y="518" font-size="26px" font-weight="700" fill="#171717" text-anchor="start">写功能</text><text x="360" y="518" font-size="21px" font-weight="400" fill="#6E7476" text-anchor="start">从 UI 进入可运行工具</text><text x="76" y="568" font-size="18px" font-weight="800" fill="#C76D3A" text-anchor="start">06</text><text x="142" y="568" font-size="26px" font-weight="700" fill="#171717" text-anchor="start">做检查</text><text x="360" y="568" font-size="21px" font-weight="400" fill="#6E7476" text-anchor="start">确认功能能用、结果可交付</text><rect x="70" y="642" width="1140" height="36" fill="#1F6EA8" stroke="none" stroke-width="0" rx="4" /><text x="640" y="667" font-size="22px" font-weight="800" fill="#FFFFFF" text-anchor="middle">制作逻辑 = 理解问题 + 组织能力 + 分步验证</text></svg>
